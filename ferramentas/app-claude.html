<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento Sorvely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* Layout: barra fixa com abas; conteúdo em coluna única com cartões, pensado primeiro para celular. */
:root{
  --bg:#f5f3f7; --surface:#ffffff; --ink:#221a29; --muted:#6c6475; --line:#e4dfe9;
  --acai:#5c2a6e; --acai-soft:#efe6f3; --mint:#1f8a74;
  --ok:#1f8a4c; --ok-bg:#e4f4ea; --warn:#a86a00; --warn-bg:#fbf0d9; --bad:#c0392b; --bad-bg:#fbe5e2; --idle:#6c6475; --idle-bg:#eeebf1;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121a; --surface:#211b27; --ink:#f1ecf5; --muted:#a79fb1; --line:#352d3d;
    --acai:#c99ae0; --acai-soft:#3a2b45; --mint:#5cc9b1;
    --ok:#5fd08e; --ok-bg:#1d3326; --warn:#f0b54a; --warn-bg:#3a2e17; --bad:#f08072; --bad-bg:#3d2220; --idle:#a79fb1; --idle-bg:#2b2532;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16121a; --surface:#211b27; --ink:#f1ecf5; --muted:#a79fb1; --line:#352d3d;
  --acai:#c99ae0; --acai-soft:#3a2b45; --mint:#5cc9b1;
  --ok:#5fd08e; --ok-bg:#1d3326; --warn:#f0b54a; --warn-bg:#3a2e17; --bad:#f08072; --bad-bg:#3d2220; --idle:#a79fb1; --idle-bg:#2b2532;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acai);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:1.25rem;color:var(--acai)}
.brand span{color:var(--muted);font-size:.85rem}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--bg);cursor:pointer}
.who b{font-weight:700}
.who .lvl{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--acai-soft);color:var(--acai);font-weight:700}
nav.tabs{display:flex;gap:4px;padding:0 12px;max-width:1100px;margin:0 auto;overflow-x:auto}
nav.tabs a{padding:10px 12px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--acai);border-bottom-color:var(--acai)}
nav.tabs a .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:.72rem;text-align:center}

main{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);font-weight:600}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-head h2{margin-right:auto}
.sub{color:var(--muted);font-size:.88rem}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--display);font-size:1.8rem;font-weight:700}
.tile .l{color:var(--muted);font-size:.85rem}
.tile.ok{border-left:5px solid var(--ok)} .tile.warn{border-left:5px solid var(--warn)} .tile.bad{border-left:5px solid var(--bad)} .tile.acai{border-left:5px solid var(--acai)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:8px;font-size:.9rem}
.bar{height:12px;border-radius:6px;background:var(--idle-bg);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}

.limit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.limit:first-of-type{border-top:0}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters input[type=search]{flex:1;min-width:160px}
.chk{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}

.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--idle);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.item.s-and{border-left-color:var(--warn)} .item.s-ok{border-left-color:var(--ok)} .item.s-bad{border-left-color:var(--bad)}
.item .id{font-family:var(--display);font-weight:700;color:var(--acai);min-width:38px}
.item .what{font-weight:700}
.item .meta{grid-column:2/4;display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.item .obs{grid-column:2/4;font-size:.88rem;background:var(--bg);border-radius:8px;padding:6px 10px}
.item .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.item.mine{box-shadow:0 0 0 2px var(--acai-soft)}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.p-idle{background:var(--idle-bg);color:var(--idle)} .p-and{background:var(--warn-bg);color:var(--warn)} .p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-acai{background:var(--acai-soft);color:var(--acai)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.d-Verde{background:var(--ok)} .d-Amarelo{background:var(--warn)} .d-Vermelho{background:var(--bad)} .d-none{background:var(--line)}

select.status{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--acai);background:var(--acai);color:var(--surface);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acai)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
dialog.wide{max-width:820px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acai);color:var(--surface)}
.seg.sm button{padding:4px 10px;font-size:.82rem}
.clic{cursor:pointer}.clic:hover{color:var(--acai);text-decoration:underline}
.prog{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.prog-bar{width:110px;height:8px;border-radius:4px;background:var(--idle-bg);overflow:hidden;display:inline-block}
.prog.mini .prog-bar{width:70px}
.prog-bar i{display:block;height:100%;background:var(--ok)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
.bcol{background:var(--bg);border:1px dashed var(--line);border-radius:var(--r);padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.bcol.drop-on{border-color:var(--acai);background:var(--acai-soft)}
.bcol h3{display:flex;gap:8px;align-items:center;font-size:.95rem}
.bcol-list{display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.kcard[draggable=true]{cursor:grab}.kcard.dragging{opacity:.5}
.kcard:hover{border-color:var(--acai)}
.kcard.s-and{border-left-color:var(--warn)}.kcard.s-ok{border-left-color:var(--ok)}.kcard.s-bad{border-left-color:var(--bad)}
.kcard.mine{box-shadow:0 0 0 2px var(--acai-soft)}
.kc-top,.kc-foot{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.kc-top .id{font-family:var(--display);font-weight:700;color:var(--acai)}
.kc-what{font-weight:700;font-size:.9rem}
.kc-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted)}
.empty.sm{padding:10px;font-size:.85rem}
.gantt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gantt{min-width:860px;font-size:.82rem}
.g-row{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--line);min-height:30px}
.g-lab{padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.g-lab .id{font-weight:700;color:var(--acai)}
.g-track{position:relative}
.g-head .g-track{height:28px}
.g-mes{position:absolute;top:6px;padding-left:4px;color:var(--muted);font-size:.75rem;border-left:1px solid var(--line);height:22px}
.g-onda{background:var(--bg)}
.g-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--acai);z-index:1}
.g-bar{position:absolute;top:7px;height:16px;border:0;border-radius:5px;padding:0;cursor:pointer;overflow:hidden;opacity:.9}
.g-bar i{display:block;height:100%;background:rgba(255,255,255,.45)}
.g-orig{position:absolute;top:4px;height:22px;border-left:2px dashed var(--ink);z-index:2}
.det{display:flex;flex-direction:column;gap:12px}
.det-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.det-head h2{margin-top:4px}
.det-head .id{font-family:var(--display);font-weight:700;color:var(--acai)}
.det-status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:5px solid var(--idle)}
.det-status.s-and{border-left-color:var(--warn)}.det-status.s-ok{border-left-color:var(--ok)}.det-status.s-bad{border-left-color:var(--bad)}
.det-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem}
.det-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.det-tabs button{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.det-tabs button.on{color:var(--acai);border-bottom-color:var(--acai)}
.det-body{display:flex;flex-direction:column;gap:10px;min-height:180px}
dl.w5{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0}
dl.w5 dt{font-weight:700;color:var(--muted)}dl.w5 dd{margin:0}
ol.passos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:ps}
ol.passos li{counter-increment:ps;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
ol.passos li.feito{background:var(--ok-bg)}
ol.passos li.feito .ps-chk span{text-decoration:line-through;color:var(--muted)}
.ps-chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.ps-chk::before{content:counter(ps)".";font-weight:700;color:var(--acai);min-width:18px}
.ps-chk input{margin-top:3px}
.ps-meta{grid-column:1/2;display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding-left:26px}
.ps-meta .atras{color:var(--bad);font-weight:700}
.ps-act{grid-column:2/3;grid-row:1/3;display:flex;gap:4px;align-items:flex-start}
.add-passo{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.add-passo .field,.add-passo .row2{width:100%}
.banner.ok-b{background:var(--ok-bg);color:var(--ok);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nota-box{display:flex;flex-direction:column;gap:6px}
.nota-box textarea{min-height:70px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
ul.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
ul.tl li{position:relative;font-size:.9rem}
ul.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--idle);border:2px solid var(--surface)}
ul.tl li.tl-nota::before{background:var(--acai)}ul.tl li.tl-status::before{background:var(--warn)}ul.tl li.tl-alteracao::before,ul.tl li.tl-criacao::before{background:var(--mint)}ul.tl li.tl-prazo::before{background:var(--bad)}ul.tl li.tl-passo::before{background:var(--ok)}
ul.tl li.empty::before{display:none}
ul.tl .tl-campos li::before{display:none}
ul.tl .tl-campos li{list-style:disc}
.tl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-tipo{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tl-nota{background:var(--acai-soft);border-radius:10px;padding:8px 10px;margin-top:4px;white-space:pre-wrap}
.tl-campos{margin:4px 0 0;padding-left:18px}
.tl-campos s{color:var(--muted)}
ul.feed{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.feed-it{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem}
.feed-it:hover{background:var(--bg)}
.feed-it .id{font-family:var(--display);font-weight:700;color:var(--acai);min-width:34px}
@media (max-width:520px){dl.w5{grid-template-columns:1fr}.g-row{grid-template-columns:150px 1fr}.ps-act{grid-column:1/2;grid-row:auto}}
.it-list{display:flex;flex-direction:column;gap:6px}
.it-row{display:grid;grid-template-columns:1fr 80px 130px auto;gap:6px;align-items:center}
.it-row input,.it-row select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
fieldset.perm{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;margin:0}
fieldset.perm legend{font-weight:700;font-size:.85rem;padding:0 4px}
td.atras,.num.atras{color:var(--bad);font-weight:700}
.item .id input{margin-right:4px}
@media (max-width:520px){.it-row{grid-template-columns:1fr 70px;}.it-row .it-u{grid-column:1/2}}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
table.cx input{width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
table.cx tr.tot td{border-top:2px solid var(--line)}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--warn);font-weight:700}
.cx-res{font-weight:700;display:flex;gap:8px;align-items:center}
.card.quick{display:flex;flex-direction:column;gap:10px}
.q-grid{display:grid;grid-template-columns:1fr 1.2fr .8fr 1.2fr 1.2fr .8fr;gap:8px}
.q-grid input,.q-grid select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
tr.rota td{background:var(--warn-bg)}
td.acts{display:flex;gap:4px;align-items:center}
.stk-h{margin:16px 0 8px;display:flex;gap:8px;align-items:baseline}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.stk-it{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:var(--r);padding:8px 10px}
.stk-it.warn{border-left-color:var(--warn)} .stk-it.bad{border-left-color:var(--bad)} .stk-it.off{opacity:.55}
.stk-n{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer} .stk-n .sub{font-size:.78rem}
.stk-q{font-family:var(--display);font-size:1.5rem;font-weight:700;min-width:2ch;text-align:right}
.stk-it .btn{min-width:46px;font-size:1.05rem;padding:6px 10px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.vp-row{grid-template-columns:150px 1fr 40px}
@media (max-width:600px){.vp-row{grid-template-columns:110px 1fr 36px}.vp-ac{display:none}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.cards{grid-template-columns:1fr}}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.eq{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--idle);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.eq.ok{border-left-color:var(--ok)}.eq.bad{border-left-color:var(--bad)}
.eq-h{display:flex;justify-content:space-between;gap:6px;align-items:center}
.eq-ls{display:flex;flex-wrap:wrap;gap:4px}
.eq-in{display:flex;gap:6px}.eq-in input{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
@media (max-width:700px){.q-grid{grid-template-columns:1fr 1fr}.row3{grid-template-columns:1fr}}
a.ajuda{font-weight:700;color:var(--acai);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
a.ajuda:hover{background:var(--acai-soft)}
.card.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--acai-soft);border-color:transparent}
.card.hero h2{font-size:1.5rem}
h3.sec{margin:4px 0 10px;font-size:1rem;color:var(--muted)}
.atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.atalho{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:92px}
.atalho:hover{border-color:var(--acai)}
.atalho.forte{border:2px solid var(--acai)}
.at-t{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--acai);display:flex;gap:6px;align-items:center}
.at-d{color:var(--muted);font-size:.88rem}
.atalho .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.75rem;text-align:center;font-family:var(--body)}
ul.pend{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.pend-it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;cursor:pointer;font-size:.95rem}
.pend-it:hover{background:var(--bg)}
.pend-it.p-bad{color:var(--bad);font-weight:600}
.subnav{margin-bottom:4px}
.subnav a{padding:7px 14px;font-weight:700;color:var(--muted);text-decoration:none}
.subnav a.on{background:var(--acai);color:var(--surface)}

<script>
"use strict";
/* ---------- Constantes ---------- */
const NIVEIS = {
  "Liderança":{desc:"Vê e edita tudo, aprova propostas, muda metas e gerencia usuários e PINs."},
  "Equipe":{desc:"Vê só as atividades e os indicadores em que é responsável (ou também a visão geral do plano, se liberada), atualiza o status delas, lança indicadores e envia propostas."},
  "Consulta":{desc:"Vê a visão geral do plano e dos indicadores, sem os itens sensíveis, e não altera nada."}
};
const PIN_ITER = 100000, SESSAO_HORAS = 12, MAX_TENT = 5;
const ST_PLANO = ["Não iniciada","Em andamento","Concluída","Atrasada"];
const ST_TRILHA = ["Não iniciada","Em andamento","Concluída"];
const CATEGORIAS = ["Produto","Marketing e comercial","Compras","Decisão com prazo próprio"];
const PERSPECTIVAS = ["Financeira","Clientes e mercado","Processos internos","Pessoas e aprendizado","Validação do plano"];
const LIM_PLANO = 5, LIM_TRILHA = 2;

/* ---------- Estado ---------- */
const S = {
  db:null, user:null, uid:null, owner:false, canWrite:true,
  eu:null, // nome escolhido
  geral:{dataInicio:"2026-09-20"},
  acoes:[], trilha:[], indicadores:[], lanc:[], propostas:[], usuarios:[], hist:[], detalhe:null, raw:{}, solic:[], ordens:[], produtos:[], caixas:[], entDias:[], tempDias:[], equip:[], estoque:[], estMov:[], vendasProd:[], ponto:[], comunicados:[], ciencias:[], checklists:[], ckCfg:null,
  loaded:{}, view:"painel",
  f:{plano:{onda:"",status:"",onde:"",minhas:false,q:"",vis:"lista"}, trilha:{cat:"",status:"",minhas:false,q:"",vis:"lista"}, prod:{sub:null,solSt:"ativas",sel:new Set(),dias:15}, rot:{sub:null,dataEnt:null,diasCx:7,localT:null,ultCanal:"",ckTipo:null}, eq:{sub:"usuarios",mesP:null}}
};

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pessoa = n => S.usuarios.find(p => p.nome === n);
const ativos = () => S.usuarios.filter(u => u.ativo !== false).sort((a,b)=>(a.ordem??99)-(b.ordem??99)||a.nome.localeCompare(b.nome));
const nivelEu = () => { const p = S.eu && pessoa(S.eu); return p && p.ativo !== false ? p.nivel : null; };
const ehLider = () => nivelEu() === "Liderança";
const verGeral = () => { const p=S.eu&&pessoa(S.eu); return !!p&&p.ativo!==false&&(p.nivel==="Liderança"||p.nivel==="Consulta"||!!p.visaoGeral); };
const podeEscrever = () => S.canWrite && (nivelEu() === "Liderança" || nivelEu() === "Equipe");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600);}
function parseISO(s){if(!s)return null;const [y,m,d]=String(s).slice(0,10).split("-").map(Number);if(!y)return null;return new Date(y,m-1,d);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function hoje(){const d=new Date();d.setHours(0,0,0,0);return d;}
function addDias(base,n){const d=new Date(base);d.setDate(d.getDate()+n);return d;}
function fmtD(d){if(!d)return "";return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});}
function fmtNum(v,u){
  if(v===null||v===undefined||v==="")return "sem dado";
  const n=Number(v);
  if(u==="R$")return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
  const s=n.toLocaleString("pt-BR",{maximumFractionDigits:2});
  if(u==="%")return s+"%";
  if(u==="minutos")return s+" min";
  if(u==="dias")return s+" dias";
  if(u==="horas")return s+" h";
  if(u==="R$/L")return "R$ "+s+"/L";
  return s;
}
function contem(quem,nome){
  const p=pessoa(nome); if(!p)return false;
  const t=String(quem||"").toLowerCase();
  return [p.nome,...(p.chaves||[])].map(k=>String(k).toLowerCase().trim()).filter(Boolean).some(k=>t.includes(k));
}
function ehResp(it,nome){
  if(!it||!nome)return false;
  if(Array.isArray(it.responsaveis)&&it.responsaveis.length)return it.responsaveis.includes(nome);
  return contem(it.quem,nome);
}
function quemTxt(it){return Array.isArray(it.responsaveis)&&it.responsaveis.length?it.responsaveis.join(", "):(it.quem||"sem responsável");}
function respDeTexto(txt){return ativos().filter(u=>contem(txt,u.nome)).map(u=>u.nome);}
function campoResp(sel,detalhe,idp){
  const nomes=ativos().map(u=>u.nome);
  return `<div class="field"><label>Quem (Who)</label><div class="resp-grid">${nomes.map(n=>`<label class="chk resp"><input type="checkbox" name="resp" value="${esc(n)}" ${sel.includes(n)?"checked":""}> ${esc(n)}</label>`).join("")}</div>
  <input id="${idp}_det" name="quemDet" value="${esc(detalhe||"")}" placeholder="Detalhe opcional, ex.: com apoio do advogado" aria-label="Detalhe de quem faz"></div>`;
}
function datasAcao(a){
  const base=parseISO(S.geral.dataInicio)||hoje();
  return {ini:addDias(base,(Number(a.diaIni)||1)-1), fim:addDias(base,(Number(a.diaFim)||1)-1)};
}
function vencida(a){ if(a.status==="Concluída")return false; return datasAcao(a).fim < hoje(); }
function vencidaTrilha(t){ if(t.status==="Concluída"||!t.prazo)return false; return parseISO(t.prazo) < hoje(); }
function stClass(st,venc){ if(st==="Concluída")return "ok"; if(st==="Atrasada"||venc)return "bad"; if(st==="Em andamento")return "and"; return "idle"; }
function pillStatus(st,venc){const c=stClass(st,venc);return `<span class="pill p-${c}">${esc(st)}</span>`+(venc&&st!=="Atrasada"?` <span class="pill p-bad">prazo vencido</span>`:"");}
function farolAuto(valor,dir,lv,la){
  if(lv===null||lv===undefined||lv===""||isNaN(Number(valor)))return "";
  lv=Number(lv); la=(la===null||la===undefined||la==="")?lv:Number(la); valor=Number(valor);
  if(dir==="Maior é melhor"){ if(valor>=lv)return "Verde"; if(valor>=la)return "Amarelo"; return "Vermelho"; }
  if(valor<=lv)return "Verde"; if(valor<=la)return "Amarelo"; return "Vermelho";
}
function parseNum(r){r=String(r??"").trim();if(r==="")return NaN;return r.includes(",")?Number(r.replace(/\./g,"").replace(",",".")):Number(r);}
function ordenarId(a,b){const [x1,y1]=String(a.id).split(".").map(Number),[x2,y2]=String(b.id).split(".").map(Number);return x1-x2||y1-y2;}

/* ---------- Gravação ---------- */
async function gravar(fn,okMsg){
  if(!S.db){toast("Sem conexão com os dados agora.");return false;}
  try{ await fn(); if(okMsg)toast(okMsg); return true; }
  catch(e){
    if(e&&e.code==="cancel")return false;
    if(e&&e.code==="invalid_argument"){ S.canWrite=false; render(); toast("Você só tem acesso de leitura. Peça ao Marco acesso de edição."); }
    else if(e&&e.code==="unavailable"){ toast("Falha momentânea de conexão. Tente de novo."); }
    else toast("Não foi possível salvar ("+(e&&e.code||"erro")+").");
    return false;
  }
}
const quemSou = () => S.eu || "Alguém";
const carimbo = () => ({por:quemSou(), em:new Date().toISOString()});

/* ---------- Diálogo ---------- */
function abrirDlg(html,onSubmit,{onOpen}={}){
  const d=$("#dlg"), f=$("#dlgForm");
  d.classList.remove("wide"); S.detalhe=null;
  f.innerHTML=html;
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const btn=ev.submitter;
    if(btn&&btn.value==="cancel"){d.close();return;}
    const r=await onSubmit(new FormData(f),btn?btn.value:"ok",f);
    if(r!==false)d.close();
  };
  if(!d.open)d.showModal();
  if(onOpen)onOpen(f);
}
const optsStatus=(arr,sel)=>opts(arr,sel)+(sel!=="Concluída"?`<option disabled>──────────</option><option value="__prazo">Prazo não cumprido…</option>`:"");
const opts=(arr,sel)=>arr.map(o=>{const v=typeof o==="object"?o.v:o,l=typeof o==="object"?o.l:o;return `<option value="${esc(v)}"${String(v)===String(sel)?" selected":""}>${esc(l)}</option>`;}).join("");

/* ---------- Identidade, PIN e sessão ---------- */
const slugP=n=>n.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
function novoSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a);}
async function hashPin(pin,salt){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:PIN_ITER,hash:"SHA-256"},k,256));
}
function pinFraco(p){
  if(!/^\d{4,6}$/.test(p))return "O PIN precisa ter de 4 a 6 números.";
  if(/^(\d)\1+$/.test(p))return "Evite PIN com todos os números iguais.";
  if("0123456789".includes(p)||"9876543210".includes(p))return "Evite sequências como 1234.";
  return "";
}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function lsSet(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function sessaoValida(){
  const s=S.sessao||lsGet("sorvely_sessao"); if(!s||!s.nome||!s.exp||s.exp<Date.now())return null;
  const p=pessoa(s.nome); if(!p||p.ativo===false)return null;
  if(p.pinMudouEm&&s.inicio&&p.pinMudouEm>s.inicio)return null; // PIN redefinido depois do login
  return s.nome;
}
function guardarSessao(obj){
  S.sessao=obj; lsSet("sorvely_sessao",obj);
  if(S.db&&S.uid){ const r=S.db.doc("data/users/"+S.uid+"/sessao"); (obj?r.set(obj):r.delete()).catch(()=>{}); }
}
function sair(){guardarSessao(null);S.eu=null;aplicarVis();render();toast("Você saiu.");setTimeout(()=>entrar(false),300);}

function entrar(obrigatorio){
  const lista=ativos();
  if(!lista.length){toast("Ainda não há usuários cadastrados.");return;}
  let sel=null;
  abrirDlg(`<h2>Entrar</h2>

function metricasPlano(){
  const a=S.acoes, tot=a.length;
  const c=s=>a.filter(x=>x.status===s).length;
  const conc=c("Concluída"), and=c("Em andamento"), nao=c("Não iniciada");
  const atr=a.filter(x=>x.status==="Atrasada"||vencida(x)).length;
  const rot=a.filter(x=>x.status==="Concluída"&&x.rotina).length;
  // aderência: concluídas no prazo / previstas até hoje
  const previstas=a.filter(x=>prazoOriginal(x)<=hoje());
  const noPrazo=previstas.filter(x=>x.status==="Concluída"&&!concluidaComAtraso(x)).length;
  const aderencia = previstas.length? noPrazo/previstas.length*100 : (tot?conc/tot*100:0);
  const replanejadas=[...a,...S.trilha].filter(x=>(x.replans||[]).length).length;
  const w5=a.filter(w5ok).length;
  return {tot,conc,and,nao,atr,rot,aderencia,pctRotina:conc?rot/conc*100:0, previstas:previstas.length,replanejadas,w5};
}

const COLS_BKP=["config","usuarios","acoes","trilha","indicadores","lancamentos","propostas","solicitacoes","ordens","produtos","caixas","entregas","temperaturas","equipamentos","estoque","estoqueMov","historico","vendasProduto","ponto","comunicados","ciencias","checklists"];
function lerColecao(c){
  return new Promise((res,rej)=>{let un=null,fim=false;
    const ok=sn=>{if(fim)return;fim=true;clearTimeout(t);setTimeout(()=>un&&un(),0);res(Object.fromEntries(sn.docs.map(d=>{const x={...d.data()};if(c==="usuarios"){delete x.pinHash;delete x.pinSalt;}return [d.id,x];})));};
    let ult=null; const t=setTimeout(()=>{ if(ult)ok(ult); else {fim=true;rej(new Error(c));} },20000);
    un=S.db.collection(c).onSnapshot(sn=>{ult=sn; if(!(sn.metadata&&sn.metadata.fromCache))ok(sn);},e=>{if(!fim){fim=true;clearTimeout(t);rej(e);}});
  });
}
async function baixarBackup(btn){
  if(!ehLider()||!S.db)return;
  const dl=await claude.use("downloads").catch(()=>null);
  if(!dl){toast("O download não está disponível nesta tela.");return;}
  btn.disabled=true; const txt=btn.textContent; btn.textContent="Gerando...";
  try{
    const out={app:"Sorvely",versao:1,em:new Date().toISOString(),por:quemSou(),dados:{}};
    for(const c of COLS_BKP) out.dados[c]=await lerColecao(c);
    const data=new TextEncoder().encode(JSON.stringify(out));
    await dl.save({filename:`Sorvely_backup_${iso(hoje())}.json`,data:data.buffer});
    toast("Backup baixado. Os PINs não vão no arquivo.");
  }catch(e){ toast("Não consegui gerar o backup ("+(e&&(e.code||e.message)||"erro")+")."); }
  finally{ btn.disabled=false; btn.textContent=txt; }
}

  try{
    await carregarXLSX();

/* ---------- Atividades: visualizações, ficha, passos, observações e histórico ---------- */
const ROT_CAMPOS={oque:"O que",porque:"Por quê",onde:"Onde",quem:"Quem",como:"Como",quanto:"Quanto custa",criterio:"Pronto quando",diaIni:"Início previsto",diaFim:"Fim previsto",obs:"Observações fixas",rotina:"Virou rotina",categoria:"Categoria",prazo:"Prazo",prazoTexto:"Prazo (texto)",custo:"Custo",preco:"Preço de venda",aprovada:"Aprovada pela proprietária",sensivel:"Sensível",responsaveis:"Responsáveis"};
function fmtCampo(k,v){
  if(Array.isArray(v))return v.length?v.join(", "):"ninguém";
  if(v===undefined||v===null||v==="")return "vazio";
  if(k==="diaIni"||k==="diaFim")return fmtD(addDias(basePlano(),Number(v)-1));
  if(k==="prazo")return fmtD(parseISO(v));
  if(k==="rotina"||k==="aprovada"||k==="sensivel")return v?"Sim":"Não";
  if(k==="custo"||k==="preco"||k==="quanto")return fmtQuanto(v);
  return String(v);
}
function colecao(col){return col==="acoes"?S.acoes:S.trilha;}
function itemDe(col,doc){return colecao(col).find(x=>x._doc===doc);}
function histDe(col,doc){return S.hist.filter(h=>h.alvo===col+"/"+doc).sort((a,b)=>(b.em||"").localeCompare(a.em||""));}
function logHist(col,item,e){
  if(!S.db)return;
  S.db.collection("historico").add({alvo:col+"/"+item._doc,itemId:item.id||"",itemOque:item.oque||"",por:quemSou(),em:new Date().toISOString(),...e}).catch(()=>{});
}
function quando(isoStr){
  if(!isoStr)return "";
  const d=new Date(isoStr), min=Math.round((Date.now()-d)/60000);
  if(min<1)return "agora";
  if(min<60)return "há "+min+" min";
  if(min<60*24)return "há "+Math.round(min/60)+" h";
  if(min<60*24*7)return "há "+Math.round(min/1440)+" dia"+(Math.round(min/1440)>1?"s":"");
  return fmtD(d);
}
function progresso(it){const p=it.passos||[];if(!p.length)return null;const f=p.filter(x=>x.feito).length;return {f,t:p.length,pct:Math.round(f/p.length*100)};}
function barraProg(it,mini){const pr=progresso(it);if(!pr)return "";return `<span class="prog ${mini?"mini":""}" title="${pr.f} de ${pr.t} passos"><span class="prog-bar"><i style="width:${pr.pct}%"></i></span><span class="num">${pr.f}/${pr.t} passos</span></span>`;}
function quemDefiniu(it){
  if(it.statusPor)return `${esc(it.status)} · definido por <b>${esc(it.statusPor)}</b> ${quando(it.statusEm)}`;
  return "";
}

/* ---- mudar status (lista, quadro, ficha) ---- */
async function aplicarStatus(col,doc,novo){
  const it=itemDe(col,doc); if(!it)return false;
  if(novo===it.status)return true;
  if(!podeEditarItem(it)){toast(S.eu?"Você só pode mudar as atividades em que seu nome aparece.":"Entre com seu nome e PIN para alterar.");if(!S.eu)entrar(false);return false;}
  if(!(await validarStatus(col,it,novo)))return false;
  const ok=await gravar(()=>S.db.doc(col+"/"+doc).update({...camposStatus(it,novo),atualizado:carimbo()}),"Status alterado para "+novo+".");
  if(ok)logHist(col,it,{tipo:"status",de:it.status,para:novo});
  return ok;
}
async function salvarComHist(col,it,d,msg){
  const campos=Object.keys(ROT_CAMPOS).filter(k=>k in d&&String(d[k]??"")!==String(it[k]??"")).map(k=>({campo:ROT_CAMPOS[k],de:fmtCampo(k,it[k]),para:fmtCampo(k,d[k])}));
  const ok=await gravar(()=>S.db.doc(col+"/"+it._doc).update(d),msg);
  if(ok){
    if(d.status&&d.status!==it.status)logHist(col,it,{tipo:"status",de:it.status,para:d.status});
    if(campos.length)logHist(col,it,{tipo:"alteracao",campos});
  }
  return ok;
}

function vCronograma(lista){
  if(!lista.length)return '<p class="empty">Nenhuma ação com esses filtros.</p>';
  const base=basePlano();
  const fins=lista.map(a=>datasAcao(a).fim), inis=lista.map(a=>datasAcao(a).ini);
  const ini=new Date(Math.min(base,...inis,hoje())), fim=new Date(Math.max(...fins,addDias(hoje(),14)));
  ini.setDate(1); const fimM=new Date(fim.getFullYear(),fim.getMonth()+1,1);
  const tot=(fimM-ini)/864e5, x=d=>((d-ini)/864e5)/tot*100;
  const meses=[]; for(let d=new Date(ini);d<fimM;d=new Date(d.getFullYear(),d.getMonth()+1,1))meses.push(new Date(d));

function itemTL(h){

  else if(h.tipo==="alteracao")corpo=`<ul class="tl-campos">${(h.campos||[]).map(c=>`<li><b>${esc(c.campo)}:</b> <s>${esc(c.de)}</s> → ${esc(c.para)}</li>`).join("")}</ul>`;

async function acaoDetalhe(b){
  const {col,doc}=S.detalhe, it=itemDe(col,doc); if(!it)return;
  const k=b.dataset.det, i=Number(b.dataset.i), p=(it.passos||[]).map(x=>({...x}));
  if(k==="fechar"){$("#dlg").close();return;}
  if(k==="aba"){S.detalhe.aba=b.dataset.aba;atualizarDetalhe();return;}
  if(k==="filtro"){S.detalhe.filtro=b.dataset.f;atualizarDetalhe();return;}
  if(k==="prazo"){$("#dlg").close();setTimeout(()=>naoDeu(col,doc),0);return;}
  if(k==="editar"){$("#dlg").close();setTimeout(()=>(col==="acoes"?formAcao(it):formTrilha(it)),0);return;}
  if(k==="concluir"){await aplicarStatus(col,doc,"Concluída");return;}
  if(k==="nota-add"){
    const t=($("#nt_txt").value||"").trim(); if(!t){toast("Escreva a observação antes de publicar.");return;}
    S.detalhe.rascunho=""; $("#nt_txt").value="";
    S.db.collection("historico").add({alvo:col+"/"+doc,itemId:it.id,itemOque:it.oque,tipo:"nota",texto:t,por:quemSou(),em:new Date().toISOString()}).then(()=>toast("Observação publicada.")).catch(()=>{toast("Não foi possível publicar.");S.detalhe.rascunho=t;});
    return;
  }
  if(k==="nota-del"){const id=b.dataset.id; if(await pergunta("Apagar observação","A observação some para todo mundo. Continuar?","Apagar"))gravar(()=>S.db.doc("historico/"+id).delete(),"Observação apagada.");return;}
  if(k==="passo-add"){
    const t=($("#ps_txt").value||"").trim(); if(!t){toast("Escreva o passo.");return;}
    p.push({id:Date.now().toString(36),texto:t,resp:($("#ps_resp").value||"").trim(),prazo:$("#ps_pz").value||"",feito:false,criadoPor:quemSou()});
    await salvarPassos(it,p,"Adicionou o passo: "+t); return;
  }
  if(k==="passo-ok"){
    const s=p[i]; s.feito=b.checked; s.feitoPor=b.checked?quemSou():""; s.feitoEm=b.checked?new Date().toISOString():"";
    const ok=await salvarPassos(it,p,(b.checked?"Concluiu o passo: ":"Reabriu o passo: ")+s.texto);
    if(ok&&b.checked&&it.status==="Não iniciada"&&podeEditarItem(it)) toast("Dica: mude o status da atividade para Em andamento.");
    return;
  }
  if(k==="passo-up"||k==="passo-down"){const j=k==="passo-up"?i-1:i+1;[p[i],p[j]]=[p[j],p[i]];await salvarPassos(it,p,"");return;}
  if(k==="passo-del"){const s=p[i];if(!(await pergunta("Remover passo",`Remover o passo "${s.texto}"?`,"Remover")))return;p.splice(i,1);await salvarPassos(it,p,"Removeu o passo: "+s.texto);return;}
  if(k==="passo-edit"){
    const s=p[i];
    const r=await dlg2(`<h2>Editar passo</h2><div class="field"><label for="pe_t">Passo</label><input id="pe_t" name="t" value="${esc(s.texto)}"></div>
      <div class="row2"><div class="field"><label for="pe_r">Responsável</label><input id="pe_r" name="r" value="${esc(s.resp||"")}"></div><div class="field"><label for="pe_p">Prazo</label><input id="pe_p" type="date" name="p" value="${esc(s.prazo||"")}"></div></div>
      <div class="dlg-foot"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn" value="ok">Salvar</button></div>`);
    if(!r)return;
    const nt=($("#pe_t").value||"").trim()||s.texto, ant=s.texto;
    s.texto=nt; s.resp=($("#pe_r").value||"").trim(); s.prazo=$("#pe_p").value||"";
    await salvarPassos(it,p,nt!==ant?`Editou o passo: ${ant} → ${nt}`:"Editou o passo: "+nt); return;
  }
}

/* ---------- Produção: solicitações da loja, ordens de produção, envio e recebimento ---------- */
const UNIDADES=["balde 10L","cuba","caixa 10L","pote 500g","pote 1L","pote 1,5L","picolé (unid.)","unidade","kg","L","pacote"];
const ST_OP=["Emitida","Em produção","Produzida","Enviada","Recebida"];
const CLS_OP={"Emitida":"idle","Em produção":"and","Produzida":"acai","Enviada":"and","Recebida":"ok","Cancelada":"bad"};
const CLS_SOL={"Aberta":"and","Em ordem":"acai","Atendida":"ok","Recusada":"bad","Cancelada":"idle"};
const PERM_ROT={solicitar:"Solicita produção (loja)",emitir:"Emite ordens de produção",produzir:"Produz e envia (fábrica)"};
function permProd(p){
  if(!p||p.ativo===false)return [];
  if(p.nivel==="Liderança")return ["solicitar","emitir","produzir"];
  if(Array.isArray(p.producao))return p.producao;
  const r=[], papel=String(p.papel||"").toLowerCase();
  if(papel.includes("loja"))r.push("solicitar");
  if(papel.includes("fábrica")||papel.includes("fabrica"))r.push("produzir");
  return r;
}
const podeProd=x=>S.canWrite&&!!S.eu&&permProd(pessoa(S.eu)).includes(x);
const veProducao=()=>!!S.eu&&permProd(pessoa(S.eu)).length>0;
const fmtQtd=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
const itensTxt=it=>(it||[]).map(i=>`${fmtQtd(i.qtd)} ${i.unidade} de ${i.produto}`).join("; ");
function proxNum(lista,pref){return pref+String(Math.max(0,...lista.map(x=>Number(String(x.num||"").replace(/\D/g,""))||0))+1).padStart(4,"0");}
function pendProducao(){
  if(!S.eu)return 0; const p=permProd(pessoa(S.eu)); let n=0;
  if(p.includes("emitir"))n+=S.solic.filter(s=>s.status==="Aberta").length;
  if(p.includes("produzir"))n+=S.ordens.filter(o=>o.status==="Emitida").length;
  if(p.includes("solicitar"))n+=S.ordens.filter(o=>o.status==="Enviada").length;
  return n;
}

function vProducao(){
  if(!veProducao())return `<div class="card"><h2>Produção</h2><p class="sub">${S.eu?"Seu usuário não participa do controle de produção. Se precisar, fale com o Marco.":"Entre com seu nome e PIN para ver a produção."}</p>${S.eu?"":'<p><button class="btn" data-act="entrar">Entrar</button></p>'}</div>`;
  const p=permProd(pessoa(S.eu));
  const padrao=p.includes("produzir")&&!p.includes("emitir")?"ordens":"solic";
  let sub=S.f.prod.sub||padrao; if(sub==="solic"&&!(p.includes("solicitar")||p.includes("emitir")))sub="ordens"; if(sub==="produtos"&&!ehLider())sub=padrao;
  const abertas=S.solic.filter(s=>s.status==="Aberta").length, emitidas=S.ordens.filter(o=>o.status==="Emitida").length, emProd=S.ordens.filter(o=>o.status==="Em produção").length, enviadas=S.ordens.filter(o=>o.status==="Enviada").length;
  return `<div class="section-head"><h2>Produção</h2>
    <div class="seg">${[...(p.includes("solicitar")||p.includes("emitir")?[["solic","Solicitações da loja"]]:[]),["ordens","Ordens de produção"],...(ehLider()?[["produtos","Produtos"]]:[])].map(([k,l])=>`<button type="button" class="${sub===k?"on":""}" data-psub="${k}">${l}</button>`).join("")}</div>
    ${podeProd("solicitar")?'<button class="btn" data-act="novaSol">Nova solicitação</button>':""}
    ${podeProd("emitir")?'<button class="btn ghost" data-act="novaOP">Nova ordem</button>':""}</div>
  <div class="tiles">
    ${p.includes("solicitar")||p.includes("emitir")?`<div class="tile ${abertas?"warn":""}"><span class="v num">${abertas}</span><span class="l">solicitações aguardando ordem</span></div>`:""}
    <div class="tile ${emitidas?"warn":""}"><span class="v num">${emitidas}</span><span class="l">ordens emitidas para produzir</span></div>
    <div class="tile acai"><span class="v num">${emProd}</span><span class="l">ordens em produção</span></div>
    <div class="tile ${enviadas?"warn":""}"><span class="v num">${enviadas}</span><span class="l">enviadas aguardando conferência na loja</span></div>
  </div>
  ${ajudaProducao(p)}
  ${sub==="ordens"?vOrdens():sub==="produtos"?vProdutos():vSolic()}`;
}
function ajudaProducao(p){
  const t=[];
  if(p.includes("solicitar"))t.push("<b>Loja:</b> use <b>Nova solicitação</b> para pedir o que está faltando. Quando a ordem chegar como <b>Enviada</b>, confira e clique em <b>Confirmar recebimento</b>.");
  if(p.includes("emitir"))t.push("<b>Emissão:</b> marque as solicitações abertas e clique em <b>Emitir ordem com as selecionadas</b>. Você pode ajustar as quantidades antes de emitir.");
  if(p.includes("produzir"))t.push("<b>Fábrica:</b> abra a ordem, clique em <b>Iniciar produção</b>, depois registre o que foi produzido e o envio.");
  return t.length?`<div class="card help">${t.join("<br>")}</div>`:"";
}

function ligarItens(f){
  const lista=f.querySelector(".it-list");
  f.querySelector(".it-add").addEventListener("click",()=>{lista.insertAdjacentHTML("beforeend",linhaItem(lista.children.length,{}));lista.lastElementChild.querySelector(".it-p").focus();});

function lerItens(f){
  const out=[]; let erro="";
  f.querySelectorAll(".it-row").forEach(r=>{
    const produto=r.querySelector(".it-p").value.trim(), q=r.querySelector(".it-q").value.trim(), unidade=r.querySelector(".it-u").value;
    if(!produto&&!q)return;
    const qtd=parseNum(q);
    if(!produto)erro="Preencha o produto de todos os itens.";
    else if(isNaN(qtd)||qtd<=0)erro=`Informe a quantidade de ${produto}.`;
    else out.push({produto,qtd,unidade});
  });

function permRot(p){
  if(!p||p.ativo===false)return [];
  if(p.nivel==="Liderança")return ["checklist","caixa","temperatura","estoque"];
  if(Array.isArray(p.rotinas))return p.rotinas.filter(x=>x!=="entregas");
  const papel=String(p.papel||"").toLowerCase(), r=[];
  if(papel.includes("loja"))r.push("checklist","caixa","temperatura","estoque");
  if(papel.includes("fábrica")||papel.includes("fabrica"))r.push("temperatura");
  return [...new Set(r)];
}
const podeRot=x=>S.canWrite&&!!S.eu&&permRot(pessoa(S.eu)).includes(x);
const veRotinas=()=>!!S.eu&&permRot(pessoa(S.eu)).length>0;
function locaisTemp(){
  const p=pessoa(S.eu); if(!p)return [];
  if(p.nivel==="Liderança")return ["Sorveteria","Fábrica"];
  const papel=String(p.papel||"").toLowerCase(), l=[];
  if(papel.includes("loja"))l.push("Sorveteria");
  if(papel.includes("fábrica")||papel.includes("fabrica"))l.push("Fábrica");

}

function saldoEst(e){return Number(e.base||0)+movsEst(e).reduce((s,m)=>s+Number(m.qtd||0),0);}
function consumoEst(e,dias){const ini=addDias(hoje(),-dias).toISOString();return -S.estMov.filter(m=>m.sabor===e._doc&&m.tipo==="retirada"&&(m.em||"")>=ini).reduce((s,m)=>s+Number(m.qtd||0),0);}
function infoEst(){
  const at=S.estoque.filter(e=>e.ativo!==false).map(e=>({...e,saldo:saldoEst(e)}));
  const zer=at.filter(e=>e.saldo<=0), baixo=at.filter(e=>e.saldo>0&&e.minimo!=null&&e.saldo<=Number(e.minimo));
  return {at,zer,baixo,tot:at.reduce((s,e)=>s+Math.max(0,e.saldo),0)};

function assinarMov(){
  if(!S.db)return;
  const p=S.eu?permRot(pessoa(S.eu)):[];
  if(!p.includes("estoque")){ if(S.unsubMov){S.unsubMov();S.unsubMov=null;S.estMov=[];S.cutMov=null;} return; }
  const bases=S.estoque.map(e=>e.baseEm).filter(Boolean).sort();
  let cut=bases[0]||iso(addDias(hoje(),-90));
  const c30=addDias(hoje(),-30).toISOString(); if(cut>c30)cut=c30;
  if(S.unsubMov&&S.cutMov===cut)return;
  if(S.unsubMov)S.unsubMov();
  S.cutMov=cut;
  S.unsubMov=S.db.collection("estoqueMov").where("em",">=",cut).onSnapshot(sn=>{S.estMov=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
}

function calcCaixa(f,mostrar){
  const g=n=>{const el=f.querySelector(`[name="${n}"]`);const x=parseNum(el?el.value:"");return isNaN(x)?0:x;};
  const fundo=g("fundo"), sang=g("sangrias"), cont=g("contado"), din=cont+sang-fundo;

    f.querySelector("#cx_ts").textContent=brl(sis);f.querySelector("#cx_tc").textContent=brl(conf);

  }

  if(!l.length){lancAuto("quebra-de-caixa",data,null);lancAuto("conciliacao-no-mesmo-dia",data,null);return;}
  const abs=l.reduce((s,c)=>s+Math.abs(c.diferenca||0),0), sis=l.reduce((s,c)=>s+(c.totalSistema||0),0);

  const pend=S.propostas.filter(p=>p.status==="Aguardando aprovação"&&(verGeral()||p.propostoPor===S.eu)).length;
  return `<div class="subnav seg" role="tablist" aria-label="Partes do plano">${[["plano","Plano de Ação"],["trilha","Trilha Comercial"],["propostas","Propostas"+(pend&&ehLider()?` (${pend})`:"")]].map(([k,l])=>`<a href="#${k}" role="tab" aria-selected="${atual===k}" class="${atual===k?"on":""}">${l}</a>`).join("")}</div>`;
}
function atalho(go,titulo,desc,n,destaque){
  return `<button type="button" class="atalho ${destaque?"forte":""}" data-go="${esc(go)}"><span class="at-t">${titulo}${n?` <span class="badge">${n}</span>`:""}</span><span class="at-d">${desc}</span></button>`;
}
function vInicio(){
  if(!S.eu)return `<div class="card hero"><h2>Bem-vindo ao app da Sorvely</h2><p>Entre com seu nome e PIN para ver as suas tarefas do dia.</p><p><button class="btn" data-act="entrar">Entrar</button> <a class="btn ghost" href="${MANUAL_URL}" target="_blank" rel="noopener">Abrir o manual</a></p></div>`;
  const p=pessoa(S.eu), pr=permProd(p), rt=permRot(p), hojeI=iso(hoje());
  const minhas=[...S.acoes.filter(a=>ehResp(a,S.eu)&&a.status!=="Concluída").map(a=>({...a,col:"acoes",fim:datasAcao(a).fim,venc:vencida(a)})),...S.trilha.filter(t=>ehResp(t,S.eu)&&t.status!=="Concluída").map(t=>({...t,col:"trilha",fim:parseISO(t.prazo),venc:vencidaTrilha(t)}))].sort((a,b)=>(a.fim||9e15)-(b.fim||9e15));
  const abertas=S.solic.filter(s=>s.status==="Aberta").length, paraProd=S.ordens.filter(o=>o.status==="Emitida"||o.status==="Em produção").length, paraReceber=S.ordens.filter(o=>o.status==="Enviada").length;
  const locs=rt.includes("temperatura")?locaisTemp():[];
  const faltaTemp=locs.map(l=>{const eqs=S.equip.filter(e=>e.local===l&&e.ativo!==false);const ls=(S.tempDias.find(d=>d._doc===hojeI+"_"+slugP(l))||{}).leituras||[];return {l,total:eqs.length,feitos:eqs.filter(e=>ls.filter(x=>x.equip===e.nome).length>=2).length};});
  const cxHoje=S.caixas.filter(c=>c.data===hojeI).length;
  const emRota=pedidosDoDia(hojeI).filter(x=>x.saida&&!x.entrega).length;
  const meusInd=S.indicadores.filter(i=>!i.auto&&contem(i.resp,S.eu));
  const at=[];
  const ie=rt.includes("estoque")?infoEst():null;
  if(rt.includes("checklist")){const hj=iso(hoje()),ab=ckDoc(hj,"abertura"),fe=ckDoc(hj,"fechamento");at.push(atalho("rotinas:checklist","Checklist do dia",`Abertura: ${ab&&ab.concluido?"feita":"pendente"} · Fechamento: ${fe&&fe.concluido?"feito":"pendente"}`,0,true));}
  if(ie&&S.estoque.length)at.push(atalho("rotinas:estoque","Estoque de caixas",ie.zer.length?`${ie.zer.length} sabor(es) sem caixa`+(ie.baixo.length?` · ${ie.baixo.length} no mínimo`:""):`${ie.tot} caixas · ${ie.baixo.length} no mínimo`,ie.zer.length,true));
  if(rt.includes("caixa"))at.push(atalho("acao:novoCaixa","Fechar caixa",cxHoje?`${cxHoje} fechamento(s) hoje`:"Nenhum fechamento hoje",0,true));
  if(rt.includes("entregas"))at.push(atalho("rotinas:entregas","Entregas",emRota?`${emRota} em rota agora`:"Registrar pedidos e acerto",0,true));
  if(rt.includes("temperatura"))at.push(atalho("rotinas:temperatura","Temperatura",faltaTemp.map(f=>f.total?`${f.l}: ${f.feitos} de ${f.total} feitos hoje`:`${f.l}: cadastrar equipamentos`).join(" · ")||"Registrar leituras",0,true));
  if(pr.includes("solicitar"))at.push(atalho("acao:novaSol","Pedir produção","Avisar a fábrica do que está faltando",0,true));
  if(pr.includes("emitir"))at.push(atalho("producao:solic","Emitir ordens",abertas?`${abertas} pedido(s) da loja aguardando`:"Nenhum pedido aguardando",abertas,abertas>0));
  if(pr.includes("produzir"))at.push(atalho("producao:ordens","Ordens para produzir",paraProd?`${paraProd} ordem(ns) na fila`:"Nenhuma ordem na fila",paraProd,paraProd>0));
  if(pr.includes("solicitar")&&paraReceber)at.push(atalho("producao:ordens","Conferir recebimento",`${paraReceber} envio(s) da fábrica para conferir`,paraReceber,true));
  if(minhas.length||podeEscrever())at.push(atalho("minhas","Minhas atividades",minhas.length?`${minhas.length} em aberto${minhas.filter(x=>x.venc).length?`, ${minhas.filter(x=>x.venc).length} vencida(s)`:""}`:"Nada em aberto",minhas.filter(x=>x.venc).length,false));
  if(meusInd.length&&podeEscrever())at.push(atalho("acao:lancar","Lançar indicador",`${meusInd.length} indicador(es) sob sua responsabilidade`,0,false));
  if(podeEscrever())at.push(atalho("acao:propor","Propor uma ação","Sugerir melhoria para a Liderança",0,false));
  if(vePainel())at.push(atalho("painel","Painel geral","Visão do plano e dos indicadores",0,false));
  const pend=[];
  if(rt.includes("checklist"))pend.push(...pendCk());
  faltaTemp.filter(f=>f.total&&f.feitos<f.total).forEach(f=>pend.push({go:"rotinas:temperatura",t:`Temperatura da ${f.l.toLowerCase()==="fábrica"?"fábrica":"sorveteria"}: ${f.total-f.feitos} equipamento(s) sem as 2 leituras de hoje`,c:"and"}));
  if(rt.includes("caixa")&&!cxHoje&&new Date().getHours()>=17)pend.push({go:"acao:novoCaixa",t:"Nenhum fechamento de caixa registrado hoje",c:"and"});
  if(ie&&ie.zer.length)pend.push({go:"rotinas:estoque",t:`Sem caixa no estoque: ${ie.zer.slice(0,6).map(e=>e.nome).join(", ")}${ie.zer.length>6?" e mais "+(ie.zer.length-6):""}`,c:"and"});
  if(emRota)pend.push({go:"rotinas:entregas",t:`${emRota} entrega(s) em rota aguardando confirmação`,c:"and"});
  if(pr.includes("emitir")&&abertas)pend.push({go:"producao:solic",t:`${abertas} solicitação(ões) da loja aguardando ordem de produção`,c:"and"});
  if(pr.includes("produzir")&&paraProd)pend.push({go:"producao:ordens",t:`${paraProd} ordem(ns) de produção para fazer`,c:"and"});
  if(pr.includes("solicitar")&&paraReceber)pend.push({go:"producao:ordens",t:`${paraReceber} envio(s) para conferir na loja`,c:"and"});
  if(ehLider()){const pp=S.propostas.filter(x=>x.status==="Aguardando aprovação").length;if(pp)pend.push({go:"propostas",t:`${pp} proposta(s) da equipe aguardando avaliação`,c:"and"});}
  minhas.filter(x=>x.venc).slice(0,5).forEach(x=>pend.push({go:`abrir:${x.col}:${x._doc}`,t:`${x.id} ${x.oque}: prazo vencido em ${fmtD(x.fim)}`,c:"bad"}));
  minhas.filter(x=>!x.venc&&x.fim&&x.fim<=addDias(hoje(),7)).slice(0,5).forEach(x=>pend.push({go:`abrir:${x.col}:${x._doc}`,t:`${x.id} ${x.oque}: vence em ${fmtD(x.fim)}`,c:"idle"}));
  return `<div class="card hero"><div><h2>${saudacao()}, ${esc(S.eu)}</h2><p class="sub">${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})} · ${esc(p?.papel||nivelEu()||"")}</p></div><a class="btn ghost sm" href="${MANUAL_URL}" target="_blank" rel="noopener">Abrir o manual</a></div>
  ${cardsComunicados()}
  <section><h3 class="sec">O que você quer fazer?</h3><div class="atalhos">${at.join("")}</div></section>
  <section class="card pend-card"><h3>Para fazer hoje</h3>${pend.length?`<ul class="pend">${pend.map(x=>`<li><button type="button" class="pend-it p-${x.c}" data-go="${esc(x.go)}"><span class="dot d-${x.c==="bad"?"Vermelho":x.c==="and"?"Amarelo":"none"}"></span>${esc(x.t)}</button></li>`).join("")}</ul>`:'<p class="empty">Tudo em dia por aqui.</p>'}</section>`;
}
function irPara(go){
  const [a,b,c]=go.split(":");
  if(a==="acao"){({novoCaixa:()=>formCaixa(),novaSol:()=>formSol(),lancar:()=>formLanc(),propor:()=>formPropor()})[b]?.();return;}
  if(a==="abrir"){abrirDetalhe(b,c);return;}
  if(a==="minhas"){S.f.plano.minhas=true;S.f.trilha.minhas=true;location.hash="plano";return;}
  if(a==="rotinas")S.f.rot.sub=b;
  if(a==="producao")S.f.prod.sub=b;
  if(location.hash==="#"+a)render();else location.hash=a;
}

/* ---------- Plano de ação ---------- */
function podeEditarItem(it){ return podeEscrever() && (ehLider() || ehResp(it,S.eu)); }
function vPlano(){
  const f=S.f.plano, q=f.q.toLowerCase();
  const ondes=[...new Set(S.acoes.map(a=>a.onde))].sort();
  let l=S.acoes.filter(a=>(!f.onda||String(a.onda)===f.onda)&&(!f.onde||a.onde===f.onde)&&(!f.minhas||ehResp(a,S.eu))&&(!q||(a.oque+" "+a.quem+" "+a.obs+" "+a.id).toLowerCase().includes(q)));
  if(f.status==="vencida") l=l.filter(a=>a.status==="Atrasada"||vencida(a)); else if(f.status) l=l.filter(a=>a.status===f.status);
  l.sort(ordenarId);
  const vis=f.vis||"lista";
  return `${subPlano("plano")}<div class="section-head"><h2>Plano de Ação</h2><span class="sub">${l.length} de ${S.acoes.length} ações</span>
    ${seletorVis("plano",[["lista","Lista"],["quadro","Quadro"],["cronograma","Cronograma"]])}
    ${podeEscrever()&&ehLider()?'<button class="btn" data-act="novaAcao">Nova ação</button>':podeEscrever()?'<button class="btn ghost" data-act="propor">Propor ação</button>':""}</div>
  <div class="filters">
    <select id="fOnda" aria-label="Onda">${opts([{v:"",l:"Todas as ondas"},...[1,2,3,4].map(o=>({v:o,l:"Onda "+o}))],f.onda)}</select>
    <select id="fStatus" aria-label="Status">${opts([{v:"",l:"Todos os status"},...ST_PLANO,{v:"vencida",l:"Atrasadas ou vencidas"}],f.status)}</select>
    <select id="fOnde" aria-label="Onde">${opts([{v:"",l:"Todos os locais"},...ondes],f.onde)}</select>
    <input type="search" id="fQ" placeholder="Buscar ação, pessoa ou observação" value="${esc(f.q)}">
    ${S.eu&&verGeral()?`<label class="chk"><input type="checkbox" id="fMinhas" ${f.minhas?"checked":""}> Só as minhas</label>`:""}
  </div>
  ${vis==="lista"?ajudaStatus():(S.eu?"":ajudaStatus())}
  ${vis==="quadro"?vQuadro("acoes",l):vis==="cronograma"?vCronograma(l):`<div class="list">${l.map(cartaoAcao).join("")||'<p class="empty">Nenhuma ação com esses filtros.</p>'}</div>`}`;
}
function cartaoAcao(a){
  const {ini,fim}=datasAcao(a), venc=vencida(a), pode=podeEditarItem(a), mine=S.eu&&ehResp(a,S.eu);
  const reps=a.replans||[], orig=prazoOriginal(a), atrasoConc=concluidaComAtraso(a);
  const w=[["Por quê",a.porque],["Como",a.como],["Quanto",a.quanto],["Pronto quando",a.criterio]].filter(x=>x[1]);
  return `<div class="item s-${stClass(a.status,venc)} ${mine?"mine":""}">
    <span class="id">${esc(a.id)}</span>
    <span class="what clic" data-act="abrir" data-col="acoes" data-doc="${esc(a._doc)}" role="button" tabindex="0">${esc(a.oque)}</span>
    <div class="actions">${pode?`<label class="stlab">Status <select class="status" data-col="acoes" data-doc="${esc(a._doc)}" aria-label="Status da ação ${esc(a.id)}">${optsStatus(ST_PLANO,a.status)}</select></label>`:pillStatus(a.status,venc)}
      <button class="icon-btn" data-act="abrir" data-col="acoes" data-doc="${esc(a._doc)}">Abrir ficha${histDe("acoes",a._doc).filter(h=>h.tipo==="nota").length?" ("+histDe("acoes",a._doc).filter(h=>h.tipo==="nota").length+" obs.)":""}</button></div>
    <div class="meta"><span>Onda ${esc(a.onda)}</span><span>${esc(a.onde)}</span><span><b>Quem:</b> ${esc(quemTxt(a))}</span><span class="num">${fmtD(ini)} a ${fmtD(fim)}</span>
      ${venc&&a.status!=="Atrasada"?'<span class="pill p-bad">prazo vencido</span>':""}
      ${reps.length?`<span class="pill p-and">replanejada ${reps.length}x · prazo original ${fmtD(orig)}</span>`:""}
      ${a.status==="Concluída"?(atrasoConc?'<span class="pill p-and">concluída com atraso</span>':'')+(a.rotina?'<span class="pill p-ok">virou rotina</span>':'<span class="pill p-idle">ainda não virou rotina</span>'):""}
      ${ehLider()&&!w5ok(a)?'<span class="pill p-idle">5W2H incompleto</span>':""}
      ${ehLider()&&a.sensivel?'<span class="pill p-acai">sensível</span>':""}
      ${a.statusPor?`<span>status definido por <b>${esc(a.statusPor)}</b> ${quando(a.statusEm)}</span>`:a.atualizado?`<span>atualizado por ${esc(a.atualizado.por)} ${quando(a.atualizado.em)}</span>`:""}
      ${barraProg(a,true)}</div>
    ${w.length||a.obs||reps.length?`<div class="obs">${w.map(([k,v])=>`<div><b>${k}:</b> ${esc(k==="Quanto"?fmtQuanto(v):v)}</div>`).join("")}${a.obs?`<div><b>Obs.:</b> ${esc(a.obs)}</div>`:""}${reps.length?`<div><b>Último atraso:</b> ${esc(reps[reps.length-1].motivo)}${reps[reps.length-1].detalhe?" ("+esc(reps[reps.length-1].detalhe)+")":""}</div>`:""}</div>`:""}
  </div>`;
}
function fmtQuanto(v){const n=Number(String(v).replace(",","."));return isNaN(n)||String(v).trim()===""?v:n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function w5ok(a){return !!(a.porque&&a.como&&a.criterio&&(a.quanto!==undefined&&a.quanto!==""&&a.quanto!==null));}
function histReplans(reps){
  if(!reps||!reps.length)return "";
  return `<h3>Histórico de prazos</h3><div class="tbl"><table><thead><tr><th>Quando</th><th>Prazo anterior</th><th>Novo prazo</th><th>Motivo</th><th>Por</th></tr></thead><tbody>
  ${reps.slice().reverse().map(r=>`<tr><td class="num">${fmtD(new Date(r.em))}</td><td class="num">${fmtD(parseISO(r.fimAnterior))}</td><td class="num">${fmtD(parseISO(r.novoFim))}</td><td>${esc(r.motivo)}${r.detalhe?"<br><span class=\"sub\">"+esc(r.detalhe)+"</span>":""}</td><td>${esc(r.por)}</td></tr>`).join("")}</tbody></table></div>`;
}
function formAcao(a){
  const nova=!a; a=a||{onda:1,oque:"",onde:"",quem:"",diaIni:1,diaFim:30,status:"Não iniciada",rotina:false,obs:"",porque:"",como:"",quanto:"",criterio:""};
  const lider=ehLider(), pode=nova||podeEditarItem(a);
  const dt=nova?{ini:hoje(),fim:addDias(hoje(),29)}:datasAcao(a);
  if(!pode){
    abrirDlg(`<h2>Ação ${esc(a.id)}</h2><p><b>${esc(a.oque)}</b></p><p class="hint">${esc(a.onde)} · ${esc(quemTxt(a))} · ${fmtD(dt.ini)} a ${fmtD(dt.fim)} · ${esc(a.status)}</p>
      ${[["Por quê",a.porque],["Como",a.como],["Quanto custa",a.quanto?fmtQuanto(a.quanto):""],["Critério de conclusão",a.criterio],["Observações",a.obs]].map(([k,v])=>`<p><b>${k}:</b> ${v?esc(v):'<span class="sub">não preenchido</span>'}</p>`).join("")}
      ${histReplans(a.replans)}<div class="dlg-foot"><button class="btn" value="cancel">Fechar</button></div>`,()=>{});
    return;
  }
  abrirDlg(`<h2>${nova?"Nova ação no plano":"Ação "+esc(a.id)}</h2>
    ${lider?`<div class="field"><label for="fa_oque">O que (What)</label><textarea id="fa_oque" name="oque" required>${esc(a.oque)}</textarea></div>
    <div class="field"><label for="fa_pq">Por quê (Why)</label><textarea id="fa_pq" name="porque" placeholder="Qual problema essa ação resolve">${esc(a.porque)}</textarea></div>
    <div class="row2"><div class="field"><label for="fa_onda">Onda</label><select id="fa_onda" name="onda" ${nova?"":"disabled"}>${opts([1,2,3,4],a.onda)}</select></div>
      <div class="field"><label for="fa_onde">Onde (Where)</label><input id="fa_onde" name="onde" value="${esc(a.onde)}" list="lOnde" required></div></div>
    ${campoResp(Array.isArray(a.responsaveis)&&a.responsaveis.length?a.responsaveis:respDeTexto(a.quem),Array.isArray(a.responsaveis)&&a.responsaveis.length?a.quem:a.quem,"fa")}
    <div class="row2"><div class="field"><label for="fa_di">Início previsto (When)</label><input id="fa_di" type="date" name="ini" value="${iso(dt.ini)}" required></div>
      <div class="field"><label for="fa_df">Fim previsto</label><input id="fa_df" type="date" name="fim" value="${iso(dt.fim)}" required></div></div>
    ${nova?"":'<p class="hint">Mudar o fim aqui corrige o planejamento sem registrar atraso. Se a ação não ficou pronta a tempo, escolha "Prazo não cumprido" na caixa de status.</p>'}
    <div class="field"><label for="fa_como">Como (How)</label><textarea id="fa_como" name="como" placeholder="Passos principais">${esc(a.como)}</textarea></div>
    <div class="row2"><div class="field"><label for="fa_qt">Quanto custa (How much, R$)</label><input id="fa_qt" name="quanto" inputmode="decimal" value="${esc(a.quanto)}" placeholder="0 se não tiver custo"></div>
      <div class="field"><label for="fa_cr">Pronto quando (critério de conclusão)</label><input id="fa_cr" name="criterio" value="${esc(a.criterio)}" placeholder="ex.: checklist usado 14 dias seguidos"></div></div>
    <label class="chk"><input type="checkbox" name="sensivel" ${a.sensivel?"checked":""}> Sensível: fora da Liderança, só os responsáveis veem esta ação</label>
    <datalist id="lOnde">${[...new Set(S.acoes.map(x=>x.onde))].map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`
    :`<p><b>${esc(a.oque)}</b></p><p class="hint">${esc(a.onde)} · ${esc(quemTxt(a))} · ${fmtD(dt.ini)} a ${fmtD(dt.fim)}</p>
      ${a.porque?`<p><b>Por quê:</b> ${esc(a.porque)}</p>`:""}
      <div class="field"><label for="fa_como">Como fazer</label><textarea id="fa_como" name="como" placeholder="Passos principais">${esc(a.como)}</textarea></div>
      <div class="field"><label for="fa_cr">Pronto quando (critério de conclusão)</label><input id="fa_cr" name="criterio" value="${esc(a.criterio)}"></div>`}
    <div class="row2"><div class="field"><label for="fa_st">Status</label><select id="fa_st" name="status">${opts(ST_PLANO,a.status)}</select></div>
      <div class="field"><label for="fa_rot">Virou rotina?</label><select id="fa_rot" name="rotina">${opts([{v:"N",l:"Não"},{v:"S",l:"Sim, com procedimento escrito"}],a.rotina?"S":"N")}</select></div></div>
    <div class="field"><label for="fa_obs">Observações</label><textarea id="fa_obs" name="obs">${esc(a.obs)}</textarea></div>
    ${histReplans(a.replans)}
    <p class="err-msg" id="faErr" hidden></p>
    <div class="dlg-foot">${!nova&&lider?'<button class="btn danger" value="del" formnovalidate>Excluir</button>':""}<button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">Salvar</button></div>`,
  async (fd,btn,f)=>{
    if(btn==="del"){ return confirmar(`Excluir a ação ${a.id}?`, ()=>gravar(()=>S.db.doc("acoes/"+a._doc).delete(),"Ação excluída.")); }
    const d={rotina:fd.get("rotina")==="S",obs:fd.get("obs")||"",atualizado:carimbo()};
    if(lider){
      const di=dataParaDia(parseISO(fd.get("ini"))), df=dataParaDia(parseISO(fd.get("fim")));
      if(df<di){const e=f.querySelector("#faErr");e.textContent="O fim previsto não pode ser antes do início.";e.hidden=false;return false;}
      if(!fd.getAll("resp").length&&!String(fd.get("quemDet")||"").trim()){const e=f.querySelector("#faErr");e.textContent="Marque quem é responsável pela ação.";e.hidden=false;return false;}
      Object.assign(d,{oque:fd.get("oque").trim(),porque:fd.get("porque").trim(),como:fd.get("como").trim(),quanto:String(fd.get("quanto")).trim(),criterio:fd.get("criterio").trim(),onde:fd.get("onde").trim(),responsaveis:fd.getAll("resp"),quem:String(fd.get("quemDet")||"").trim(),diaIni:di,diaFim:df,sensivel:!!fd.get("sensivel")});
      if(nova){d.diaIniOrig=di;d.diaFimOrig=df;}
    } else { d.como=String(fd.get("como")||"").trim(); d.criterio=String(fd.get("criterio")||"").trim(); }
    const novoSt=fd.get("status");
    const base=nova?{status:"Não iniciada",onda:Number(fd.get("onda"))}:a;
    if(novoSt!==base.status){ const ok=await validarStatus("acoes",{...base,...d},novoSt); if(!ok)return false; }
    Object.assign(d,camposStatus(base,novoSt));
    if(nova){
      const onda=Number(fd.get("onda")); const id=proxIdPlano(onda);
      const nd={...d,id,onda,ordem:Date.now()}, ok=await gravar(()=>S.db.doc("acoes/a"+id.replace(".","_")).set(nd),"Ação "+id+" criada.");
      if(ok)logHist("acoes",{...nd,_doc:"a"+id.replace(".","_")},{tipo:"criacao",texto:"Ação criada"});
      return ok;
    }
    return salvarComHist("acoes",a,d,"Ação salva.");
  });
}
/* ---- datas do plano ---- */
function basePlano(){return parseISO(S.geral.dataInicio)||hoje();}
function dataParaDia(d){return Math.round((d-basePlano())/864e5)+1;}
function prazoOriginal(a){return addDias(basePlano(),(Number(a.diaFimOrig??a.diaFim)||1)-1);}
function concluidaComAtraso(a){return a.status==="Concluída"&&a.concluidaEm&&parseISO(a.concluidaEm)>prazoOriginal(a);}
/* ---- status: regras e campos ---- */
function camposStatus(item,novo){
  if(novo===item.status)return {};
  const r={status:novo,statusPor:quemSou(),statusEm:new Date().toISOString()};
  if(novo==="Concluída")r.concluidaEm=iso(hoje());
  else if(item.status==="Concluída")r.concluidaEm=null;
  return r;
}
async function validarStatus(col,item,novo){
  if(novo!=="Em andamento"||item.status==="Em andamento")return true;
  if(col==="trilha"){
    const falta=faltaCustoMargem(item);
    if(falta){ await aviso("Regra da trilha comercial",`Antes de colocar em andamento, preencha ${falta}. Nenhuma iniciativa começa sem custo e margem calculados.`); return false; }
    if(item.categoria==="Produto"&&!item.aprovada){
      if(!ehLider()){ await aviso("Falta aprovação","Mudança de produto precisa da aprovação da proprietária. Fale com o Marco ou a Eliete."); return false; }
    }
    const n=(S.raw.trilha||S.trilha).filter(t=>t.status==="Em andamento"&&t._doc!==item._doc).length;
    if(n>=LIM_TRILHA) return limiteOk(`Já existem ${n} iniciativas comerciais em andamento. O limite é ${LIM_TRILHA}.`);
  } else {
    const n=(S.raw.acoes||S.acoes).filter(t=>t.status==="Em andamento"&&t._doc!==item._doc).length;
    if(n>=LIM_PLANO) return limiteOk(`Já existem ${n} ações de controle em andamento. O limite é ${LIM_PLANO} ao mesmo tempo (seção 4.3).`);
  }
  return true;
}
async function limiteOk(msg){
  if(!ehLider()){ await aviso("Limite de ações simultâneas",msg+" Conclua uma antes ou fale com o Marco."); return false; }
  return pergunta("Limite de ações simultâneas",msg+" Quer iniciar mesmo assim?","Iniciar mesmo assim");
}
function faltaCustoMargem(t){
  const tem=v=>v!==undefined&&v!==null&&v!=="";
  if(!tem(t.custo))return t.categoria==="Produto"?"o custo unitário":"o custo estimado";
  if(t.categoria==="Produto"&&!tem(t.preco))return "o preço de venda (para calcular a margem)";
  return "";
}
function margemDe(t){const c=Number(t.custo),p=Number(t.preco);return (t.preco!==undefined&&t.preco!==""&&p>0&&!isNaN(c))?(p-c)/p*100:null;}

function dlg2(html){
  return new Promise(res=>{
    const d=$("#dlg2"),f=$("#dlg2Form"); f.innerHTML=html; let r=false;
    f.onsubmit=ev=>{ev.preventDefault(); r=ev.submitter&&ev.submitter.value==="ok"; d.close();};
    d.addEventListener("close",()=>res(r),{once:true}); d.showModal();

}

const MOTIVOS=["Falta de tempo da equipe","Dependia de outra pessoa ou fornecedor","Falta de dinheiro ou material","A prioridade mudou","O prazo foi mal estimado","Problema técnico ou de equipamento","Outro"];
function naoDeu(col,doc){
  const it=(col==="acoes"?S.acoes:S.trilha).find(x=>x._doc===doc); if(!it)return;
  const fimAtual=col==="acoes"?datasAcao(it).fim:parseISO(it.prazo);
  const sug=addDias(new Date(Math.max(hoje(),fimAtual||0)),14);
  const sts=col==="acoes"?ST_PLANO.filter(s=>s!=="Concluída"):ST_TRILHA.filter(s=>s!=="Concluída");
  abrirDlg(`<h2>Registrar prazo não cumprido</h2><p><b>${esc(it.id)}</b> ${esc(it.oque)}</p>
    <p class="hint">${fimAtual?"Prazo atual: "+fmtD(fimAtual)+". ":"Sem data de prazo. "}O app guarda o prazo original e o motivo, para a gente entender onde o plano trava.</p>
    <div class="field"><label for="nd_m">Por que não deu?</label><select id="nd_m" name="motivo" required>${opts([{v:"",l:"Escolha o motivo"},...MOTIVOS],"")}</select></div>
    <div class="field"><label for="nd_d">Explique em poucas palavras</label><textarea id="nd_d" name="detalhe" placeholder="ex.: fornecedor da urna atrasou a entrega"></textarea></div>
    <div class="row2"><div class="field"><label for="nd_p">Novo prazo</label><input id="nd_p" type="date" name="novo" min="${iso(hoje())}" value="${iso(sug)}" required></div>
      <div class="field"><label for="nd_s">Situação agora</label><select id="nd_s" name="status">${opts(sts,it.status==="Concluída"?"Em andamento":it.status)}</select></div></div>
    <p class="err-msg" id="ndErr" hidden></p>
    <div class="dlg-foot"><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">Registrar novo prazo</button></div>`,
  async (fd,btn,f)=>{
    const err=f.querySelector("#ndErr"),falha=m=>{err.textContent=m;err.hidden=false;return false;};
    if(!fd.get("motivo"))return falha("Escolha o motivo.");
    const novo=parseISO(fd.get("novo")); if(!novo||novo<hoje())return falha("O novo prazo precisa ser hoje ou depois.");
    const rep={em:new Date().toISOString(),por:quemSou(),fimAnterior:fimAtual?iso(fimAtual):"",novoFim:iso(novo),motivo:fd.get("motivo"),detalhe:String(fd.get("detalhe")||"").trim()};
    const st=fd.get("status");
    if(st!==it.status){const ok=await validarStatus(col,it,st);if(!ok)return false;}
    const d={replans:[...(it.replans||[]),rep],atualizado:carimbo(),...camposStatus(it,st)};
    if(col==="acoes"){
      if(it.diaFimOrig===undefined){d.diaFimOrig=it.diaFim;d.diaIniOrig=it.diaIni;}
      d.diaFim=dataParaDia(novo); if(Number(it.diaIni)>d.diaFim)d.diaIni=d.diaFim;

      if(it.prazoOrig===undefined)d.prazoOrig=it.prazo||"";

    const ok=await gravar(()=>S.db.doc(col+"/"+doc).update(d),"Novo prazo registrado para "+it.id+".");

    return ok;
  });
}

function spark(h,u){
  const pts=h.filter(x=>!isNaN(Number(x.valor)));
  if(pts.length<2)return "";
  const W=480,H=120,P=28; const vs=pts.map(p=>Number(p.valor)); let mn=Math.min(...vs),mx=Math.max(...vs); if(mn===mx){mn-=1;mx+=1;}
  const x=i=>P+(W-2*P)*i/(pts.length-1), y=v=>H-18-(H-36)*(v-mn)/(mx-mn);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(Number(p.valor)).toFixed(1)}`).join("");
  const area=line+`L${x(pts.length-1)},${H-18}L${x(0)},${H-18}Z`;
  const L=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do indicador">
    <line x1="${P}" x2="${W-P}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)"/><line x1="${P}" x2="${W-P}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--acai-soft)"/><path d="${line}" fill="none" stroke="var(--acai)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(Number(p.valor))}" r="${i===pts.length-1?5:3}" fill="${p.farol==="Verde"?"var(--ok)":p.farol==="Amarelo"?"var(--warn)":"var(--bad)"}"/>`).join("")}
    <text x="${P}" y="${y(mx)-4}">${esc(fmtNum(mx,u))}</text><text x="${P}" y="${H-4}">${esc(fmtNum(mn,u))}</text>
    <text x="${W-P}" y="${H-4}" text-anchor="end">${esc(fmtD(parseISO(L.dataRef)))}</text></svg>`;
}

function formLanc(docSel){

  async fd=>{
    const i=S.indicadores.find(x=>x._doc===fd.get("ind")); const err=$("#fl_err");

  },{onOpen:f=>{

      calc();};
    const calc=()=>{const i=S.indicadores.find(x=>x._doc===f.ind.value);if(!i)return;const raw=f.valor.value;if(!raw)return;const n=parseNum(raw);const fa=farolAuto(n,i.direcao,i.limVerde,i.limAmarelo);if(fa)f.farol.value=fa;};
    f.ind.addEventListener("change",upd); f.valor.addEventListener("input",calc); upd();
  }});
}
async function registrarAuto(){
  const m=metricasPlano(), data=iso(hoje());

  let ok=0;
  for(const [n,v] of vals){
    const i=S.indicadores.find(x=>x.nome===n); if(!i)continue;
    const farol=farolAuto(v,i.direcao,i.limVerde,i.limAmarelo)||"Amarelo";
    const id="auto-"+i._doc+"-"+data;
    const r=await gravar(()=>S.db.doc("lancamentos/"+id).set({dataRef:data,indicadorId:i._doc,indicador:n,perspectiva:i.perspectiva,valor:Math.round(v*10)/10,farol,obs:"Cálculo automático a partir do Plano de Ação",resp:i.resp,lancadoPor:"Sistema ("+quemSou()+")",lancadoEm:new Date().toISOString()}));
    if(r)ok++;
  }
  if(ok)toast("Indicadores automáticos registrados para hoje.");
}

const fmtHm=(m,sinal)=>{m=Math.round(m||0);const s=m<0?"-":(sinal&&m>0?"+":"");m=Math.abs(m);return s+Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");};
const NOME_MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const mesLabel=m=>{const [a,b]=String(m).split("-");return NOME_MES[Number(b)-1]+"/"+String(a).slice(2);};

/* ---------- Ponto ---------- */
function mesesPonto(){return [...new Set(S.ponto.map(p=>p.mes))].sort().reverse();}
function resumoPonto(mes){
  const l=S.ponto.filter(p=>p.mes===mes), trab=l.filter(p=>p.diasTrab>0);
  const F=trab.reduce((s,p)=>s+p.faltasMin,0), P=trab.reduce((s,p)=>s+p.prevMin,0), X=trab.reduce((s,p)=>s+p.extrasMin,0), N=trab.reduce((s,p)=>s+p.adNotMin,0);
  return {l,trab,abs:P?F/P*100:0,F,P,X,N,media:trab.length?X/trab.length:0,banco:l.reduce((s,p)=>s+(p.bancoMin||0),0)};
}
function vPonto(){
  const ms=mesesPonto();
  if(!ms.length)return `<div class="card"><h3>Cartão de ponto</h3><p class="empty">Nenhum cartão de ponto carregado ainda. Mande o PDF do AtecSoft para o Claude lançar.</p></div>`;
  const mes=ms.includes(S.f.eq.mesP)?S.f.eq.mesP:ms[0], r=resumoPonto(mes);
  const ia=indRaw("absenteismo")||{}, fa=farolAuto(r.abs,"Menor é melhor",ia.limVerde??3,ia.limAmarelo??5);
  const ih=indRaw("horas-extras")||{}, fh=farolAuto(r.media/60,"Menor é melhor",ih.limVerde??10,ih.limAmarelo??20);
  const cor=f=>f==="Verde"?"ok":f==="Amarelo"?"warn":f==="Vermelho"?"bad":"";
  const ord=r.l.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<div class="card"><div class="section-head"><h3>Cartão de ponto</h3>
    <div class="filters"><select id="pMes" aria-label="Mês">${ms.map(m=>`<option value="${m}"${m===mes?" selected":""}>${mesLabel(m)}</option>`).join("")}</select>
    ${podeEscrever()?`<button class="btn ghost sm" data-act="pontoInd" data-mes="${mes}">Lançar nos indicadores</button>`:""}</div></div>
  <div class="tiles">
    <div class="tile ${cor(fa)}"><span class="v num">${r.abs.toFixed(1).replace(".",",")}%</span><span class="l">absenteísmo (${fmtHm(r.F)} de faltas e atrasos em ${fmtHm(r.P)} previstas)</span></div>
    <div class="tile ${cor(fh)}"><span class="v num">${fmtHm(r.X)}</span><span class="l">horas extras no mês, média de ${fmtHm(r.media)} por pessoa</span></div>
    <div class="tile"><span class="v num">${fmtHm(r.N)}</span><span class="l">adicional noturno (depois das 22h)</span></div>
    <div class="tile ${r.banco>60*120?"warn":""}"><span class="v num">${fmtHm(r.banco,true)}</span><span class="l">banco de horas somado até ${mesLabel(mes)}</span></div>
  </div>
  <div class="tbl"><table><thead><tr><th>Pessoa</th><th class="num">Dias</th><th class="num">Previstas</th><th class="num">Faltas e atrasos</th><th class="num">Extras</th><th class="num">Noturno</th><th class="num">Saldo do mês</th><th class="num">Banco</th></tr></thead><tbody>
  ${ord.map(p=>`<tr><td>${esc(p.nome)}<br><span class="hint">${esc(p.funcao||"")}</span></td><td class="num">${p.ferias&&!p.diasTrab?"férias":p.diasTrab}</td><td class="num">${fmtHm(p.prevMin)}</td><td class="num">${p.faltasMin?fmtHm(p.faltasMin):"-"}</td><td class="num">${fmtHm(p.extrasMin)}</td><td class="num">${fmtHm(p.adNotMin)}</td><td class="num">${fmtHm(p.saldoMin,true)}</td><td class="num"><b>${fmtHm(p.bancoMin,true)}</b>${p.bancoMin>40*60?' <span class="pill p-and">alto</span>':""}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="hint">Fonte: ${esc((r.l[0]||{}).fonte||"cartão de ponto")}. Banco é a soma dos saldos (extras menos faltas) desde o início do relatório.</p></div>
  <div class="card"><h3>Evolução</h3><div class="tbl"><table><thead><tr><th>Mês</th><th class="num">Pessoas</th><th class="num">Absenteísmo</th><th class="num">Extras (total)</th><th class="num">Extras por pessoa</th><th class="num">Noturno</th></tr></thead><tbody>
  ${ms.slice().reverse().map(m=>{const x=resumoPonto(m);return `<tr><td>${mesLabel(m)}</td><td class="num">${x.trab.length}</td><td class="num">${x.abs.toFixed(1).replace(".",",")}%</td><td class="num">${fmtHm(x.X)}</td><td class="num">${fmtHm(x.media)}</td><td class="num">${fmtHm(x.N)}</td></tr>`;}).join("")}
  </tbody></table></div></div>`;
}
async function lancarPontoInd(mes){
  const r=resumoPonto(mes); if(!r.trab.length)return;
  const fim=mes+"-01";
  const itens=[["absenteismo","calc-absent-"+mes,Math.round(r.abs*100)/100,`${mesLabel(mes)}. ${fmtHm(r.F)} de faltas e atrasos em ${fmtHm(r.P)} previstas (${r.trab.length} pessoas). Fonte: cartão de ponto.`],
    ["horas-extras","calc-hextras-"+mes,Math.round(r.media/6)/10,`${mesLabel(mes)}. ${fmtHm(r.X)} de extras no total, ${r.trab.length} pessoas. Adicional noturno ${fmtHm(r.N)}. Fonte: cartão de ponto.`]];
  let n=0;
  for(const [id,doc,v,obs] of itens){const i=indRaw(id); if(!i)continue;
    if(await gravar(()=>S.db.doc("lancamentos/"+doc).set({dataRef:fim,indicadorId:id,indicador:i.nome,perspectiva:i.perspectiva,valor:v,farol:farolAuto(v,i.direcao,i.limVerde,i.limAmarelo)||"Amarelo",obs,resp:i.resp,lancadoPor:quemSou(),lancadoEm:new Date().toISOString()})))n++;}
  if(n)toast(`Absenteísmo e horas extras de ${mesLabel(mes)} lançados.`);
}
