  ${feito&&ehLider()?`<p><button class="btn ghost sm" data-act="ckReabrir" data-tipo="${tipo}">Reabrir</button></p>`:""}
  </div>
  <div class="card"><h3>Últimos registros</h3>${hist.length?`<div class="tbl"><table><thead><tr><th>Dia</th><th>Tipo</th><th class="num">Itens</th><th>Feito por</th><th>Conferência</th></tr></thead><tbody>${hist.map(x=>{const tot=(x.itens||[]).length||itensCk(x.tipo).length,ok=Object.keys(x.marcados||{}).length;return `<tr><td>${fmtD(parseISO(x.data))}</td><td>${x.tipo==="abertura"?"Abertura":"Fechamento"}</td><td class="num">${ok} de ${tot}</td><td>${esc(x.feitoPor||"")}</td><td>${x.conferidoPor?esc(x.conferidoPor):'<span class="pill p-and">sem conferência</span>'}${x.pendencias?' <span class="pill p-idle" title="'+esc(x.pendencias)+'">pendência</span>':""}</td></tr>`;}).join("")}</tbody></table></div>`:'<p class="empty">Nenhum checklist concluído ainda.</p>'}</div>`;
}
async function marcarCk(i,on){
  const hj=iso(hoje()), tipo=S.f.rot.ckTipo||(new Date().getHours()<18?"abertura":"fechamento"), id=hj+"_"+tipo, c=ckDoc(hj,tipo);
  if(c&&c.concluido)return;
  const marc={...((c&&c.marcados)||{})};
  if(on)marc[i]={por:quemSou(),hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}; else delete marc[i];
  const d={data:hj,tipo,itens:itensCk(tipo),marcados:marc,concluido:false,atualizadoPor:quemSou(),atualizadoEm:new Date().toISOString()};
  await gravar(()=>c?S.db.doc("checklists/"+id).update({marcados:marc,itens:d.itens,atualizadoPor:d.atualizadoPor,atualizadoEm:d.atualizadoEm}):S.db.doc("checklists/"+id).set(d));
}
async function conferirPin(u,pin){
  const tk="sorvely_tent_"+slugP(u.nome), t=lsGet(tk)||{n:0,ate:0};
  if(t.ate>Date.now())return "travado";
  let ok=false;
  try{ ok=(window.FB&&FB.conferir)?await FB.conferir(u._doc,pin):(!!u.pinHash&&(await hashPin(pin,u.pinSalt))===u.pinHash); }catch(e){ok=false;}
  if(ok){lsSet(tk,null);return "ok";}
  t.n++; if(t.n>=MAX_TENT){t.ate=Date.now()+5*60000;t.n=0;} lsSet(tk,t); return t.ate>Date.now()?"travado":"errado";
}
function concluirCk(tipo){
  const hj=iso(hoje()), id=hj+"_"+tipo, c=ckDoc(hj,tipo), base=itensCk(tipo), marc=(c&&c.marcados)||{};
  const faltam=base.filter((_,i)=>!marc[i]), pend=($("#ckPend")||{}).value||"";
  const conf=ativos().filter(u=>u.nome!==S.eu);
  abrirDlg(`<h2>Concluir ${tipo}</h2>
    ${faltam.length?`<div class="banner">${faltam.length} item(ns) não marcado(s): ${esc(faltam.join("; "))}. Explique nas pendências.</div>`:`<p class="hint">Todos os ${base.length} itens marcados.</p>`}
    <div class="field"><label for="ck_p">Pendências ou observações</label><textarea id="ck_p" name="pend" rows="2">${esc(pend)}</textarea></div>
    <div class="field"><label for="ck_c">Quem confere</label><select id="ck_c" name="conf"><option value="">Selecione</option>${conf.map(u=>`<option value="${esc(u.nome)}">${esc(u.nome)}</option>`).join("")}</select><span class="hint">A pessoa olha os itens e confirma com o PIN dela.</span></div>
    <div class="field"><label for="ck_pin">PIN de quem confere</label><input id="ck_pin" name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <p class="err-msg" id="ckErr" hidden></p>
    <div class="dlg-foot"><button class="btn ghost" value="cancel" formnovalidate>Voltar</button><button class="btn ghost" value="sem" formnovalidate>Concluir sem conferência</button><button class="btn" value="ok">Conferir e concluir</button></div>`,
  async (fd,btn,f)=>{
    const err=m=>{const e=f.querySelector("#ckErr");e.textContent=m;e.hidden=false;return false;};
    const p=String(fd.get("pend")||"").trim();
    if(faltam.length&&!p)return err("Escreva nas pendências o que ficou sem fazer.");
    let confPor="";
    if(btn==="ok"){
      const nome=fd.get("conf"), u=pessoa(nome), pin=String(fd.get("pin")||"").trim();
      if(!u)return err("Escolha quem confere."); if(!/^\d{4,6}$/.test(pin))return err("Digite o PIN de quem confere.");
      const r=await conferirPin(u,pin);
      if(r==="travado")return err("Muitas tentativas erradas para "+nome+". Espere 5 minutos.");
      if(r!=="ok"){f.querySelector("#ck_pin").value="";return err("PIN incorreto.");}
      confPor=nome;
    }
    const agora=new Date().toISOString();
    const d={data:hj,tipo,itens:base,marcados:marc,pendencias:p,concluido:true,feitoPor:quemSou(),concluidoEm:agora,conferidoPor:confPor,conferidoEm:confPor?agora:""};
    return gravar(()=>S.db.doc("checklists/"+id).set(d),confPor?"Checklist concluído e conferido por "+confPor+".":"Checklist concluído sem conferência.");
  });
}
function vCkConfig(){
  return `<div class="card"><h3>Itens do checklist</h3><p class="hint">Um item por linha. Vale a partir do próximo checklist.</p>
  <form id="ckCfgF">${CK_TIPOS.map(([k,l])=>`<div class="field"><label for="ckc_${k}">${l}</label><textarea id="ckc_${k}" name="${k}" rows="${itensCk(k).length+1}">${esc(itensCk(k).join("\n"))}</textarea></div>`).join("")}
  ${podeEscrever()?'<p><button class="btn" data-act="ckCfgSalvar" type="button">Salvar itens</button></p>':""}</form></div>`;
}
async function salvarCkCfg(){
  const d={}; for(const [k] of CK_TIPOS){d[k]=String($("#ckc_"+k).value).split("\n").map(x=>x.trim()).filter(Boolean); if(!d[k].length){toast("Cada checklist precisa de pelo menos um item.");return;}}
  await gravar(()=>S.db.doc("config/checklist").set({...d,atualizadoPor:quemSou(),atualizadoEm:new Date().toISOString()}),"Itens do checklist salvos.");
}
function pendCk(){
  const hj=iso(hoje()), h=new Date().getHours(), r=[];
  const ab=ckDoc(hj,"abertura"), fe=ckDoc(hj,"fechamento");
  if(!(ab&&ab.concluido))r.push({go:"rotinas:checklist",t:"Checklist de abertura de hoje não concluído",c:h>=17?"bad":"and"});
  if(h>=21&&!(fe&&fe.concluido))r.push({go:"rotinas:checklist",t:"Checklist de fechamento de hoje não concluído",c:"and"});
  const on=iso(addDias(hoje(),-1)), feo=ckDoc(on,"fechamento");
  if(ehLider()&&!(feo&&feo.concluido)&&S.checklists.some(x=>x.data<on))r.push({go:"rotinas:checklist",t:"Fechamento de ontem ficou sem checklist",c:"bad"});
  return r;
}

  else if(a==="editAcao")formAcao(S.acoes.find(x=>x._doc===d));

  else if(a==="verInd")verInd(d);
  else if(a==="lancar")formLanc();
  else if(a==="propor")formPropor();
  else if(a==="avaliar")avaliar(d);
  else if(a==="dataIni")formDataIni();
  else if(a==="autoInd")registrarAuto();
  else if(a==="naoDeu")naoDeu(b.dataset.col,d);
  else if(a==="abrir")abrirDetalhe(b.dataset.col,d);
  else if(a==="novaSol")formSol();
  else if(a==="novaOP")formOP([]);
  else if(a==="emitirSel")formOP([...S.f.prod.sel].filter(x=>S.solic.some(s=>s._doc===x&&s.status==="Aberta")));
  else if(a==="recusarSol")respostaSol(d,"Recusada","Recusar","Recusar solicitação");
  else if(a==="cancelarSol")respostaSol(d,"Cancelada","Cancelar","Cancelar solicitação");
  else if(a==="abrirOP")abrirOP(d);
  else if(a==="novoProd")formProd();
  else if(a==="novoCaixa")formCaixa();
  else if(a==="verCaixa")formCaixa(S.caixas.find(x=>x._doc===d));
  else if(a==="entSaiu"||a==="entEntregue"||a==="entDel")acaoEntrega(b);
  else if(a==="entAcerto")acertoEnt(b.dataset.ent);
  else if(a==="tempReg")registrarTemp(d);
  else if(a==="estRet")retirarEst(d);
  else if(a==="estDesf")desfazerEst(d);
  else if(a==="estEnt")formEntradaEst();
  else if(a==="estCont")formContagemEst();
  else if(a==="estNovo")formSaborEst();
  else if(a==="estEdit")formSaborEst(S.estoque.find(x=>x._doc===d));
  else if(a==="estRepor")pedirReposicaoEst();
  else if(a==="opSug")opPelaSugestao();
  else if(a==="vpTodos"){S.f.vpTodos=!S.f.vpTodos;render();}
  else if(a==="equipNovo")formEquip(null,locaisTemp().includes(S.f.rot.localT)?S.f.rot.localT:locaisTemp()[0]);
  else if(a==="equipEdit")formEquip(S.equip.find(x=>x._doc===d));
  else if(a==="equipPadrao")equipPadrao(b.dataset.loc);
  else if(a==="editProd")formProd(S.produtos.find(x=>x._doc===d));
  else if(a==="excel")baixarExcel(b);
  else if(a==="backup")baixarBackup(b);
  else if(a==="ciente")darCiencia(d);
  else if(a==="novoCom")formComunicado();
  else if(a==="comPres")formCienciaPresencial(d);
  else if(a==="comArq"){const c=S.comunicados.find(x=>x._doc===d);if(c)gravar(()=>S.db.doc("comunicados/"+d).update({ativo:c.ativo===false}),c.ativo===false?"Comunicado reativado.":"Comunicado arquivado.");}
  else if(a==="pontoInd")lancarPontoInd(b.dataset.mes);
  else if(a==="ckConcluir")concluirCk(b.dataset.tipo);
  else if(a==="ckReabrir"){const id=iso(hoje())+"_"+b.dataset.tipo;pergunta("Reabrir checklist","O checklist volta a ficar pendente e a conferência é apagada.","Reabrir").then(ok=>{if(ok)gravar(()=>S.db.doc("checklists/"+id).update({concluido:false,conferidoPor:"",conferidoEm:""}),"Checklist reaberto.");});}
  else if(a==="ckCfgSalvar")salvarCkCfg();
  else if(a==="novoUsu")formUsuario();
  else if(a==="editUsu")formUsuario(S.usuarios.find(x=>x._doc===d));
  else if(a==="pinUsu")redefinirPin(S.usuarios.find(x=>x._doc===d));
  else if(a==="entrar")entrar(false);
});
document.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details[data-sug]"))S.f.prod.sugOpen=e.target.open;},true);
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.matches("select.status")){
    if(!podeEscrever()){render();toast(S.eu?"Você não pode alterar este item.":"Entre com seu nome e PIN para alterar.");if(!S.eu)entrar(false);return;}
    const col=t.dataset.col,doc=t.dataset.doc,v=t.value;
    if(v==="__prazo"){const it0=itemDe(col,doc);t.value=it0?it0.status:"";render();naoDeu(col,doc);return;}
    const ok=await aplicarStatus(col,doc,v);
    if(!ok){const it0=itemDe(col,doc);t.value=it0?it0.status:"";render();}
    return;
  }
  const map={fOnda:["plano","onda"],fStatus:["plano","status"],fOnde:["plano","onde"],fMinhas:["plano","minhas"],tCat:["trilha","cat"],tStatus:["trilha","status"],tMinhas:["trilha","minhas"]};
  if(map[t.id]){const [g,k]=map[t.id];S.f[g][k]=t.type==="checkbox"?t.checked:t.value;render();}

  if(t.classList.contains("selSol")){if(t.checked)S.f.prod.sel.add(t.dataset.doc);else S.f.prod.sel.delete(t.dataset.doc);render();}
  if(t.id==="pSolSt"){S.f.prod.solSt=t.value;render();}

let qT;
document.addEventListener("input",e=>{
  const t=e.target; if(t.id!=="fQ"&&t.id!=="tQ"&&t.id!=="eQ"&&t.id!=="vpQ")return;
  clearTimeout(qT); qT=setTimeout(()=>{if(t.id==="eQ")S.f.rot.qEst=t.value;else if(t.id==="vpQ")S.f.vpQ=t.value;else S.f[t.id==="fQ"?"plano":"trilha"].q=t.value;render();const el=document.getElementById(t.id);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},250);
});
$("#whoBtn").addEventListener("click",menuUsuario);
function rota(){const h=location.hash.slice(1);S.view=["inicio","painel","plano","trilha","indicadores","propostas","usuarios","producao","rotinas"].includes(h)?h:"inicio";render();}

/* ---------- Conexão ---------- */
let rT;
function agendaRender(){cancelAnimationFrame(rT);rT=requestAnimationFrame(()=>{ if(!$("#dlg").open) render(); else { S.pendRender=true; if(S.detalhe)atualizarDetalhe(); } });}
$("#dlg").addEventListener("close",()=>{ $("#dlg").classList.remove("wide"); S.detalhe=null; if(S.pendRender){S.pendRender=false;render();} });

$("#dlgForm").addEventListener("change",e=>{ if(!S.detalhe)return; const b=e.target.closest("input[data-det]"); if(b)acaoDetalhe(b); });
$("#dlgForm").addEventListener("input",e=>{ if(S.detalhe&&e.target.id==="nt_txt")S.detalhe.rascunho=e.target.value; });
/* arrastar e soltar no quadro */
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".kcard[draggable=true]");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.col+"|"+c.dataset.doc);e.dataTransfer.effectAllowed="move";c.classList.add("dragging");});
document.addEventListener("dragend",e=>{document.querySelectorAll(".dragging,.drop-on").forEach(x=>x.classList.remove("dragging","drop-on"));});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest(".bcol[data-drop]");if(!z)return;e.preventDefault();document.querySelectorAll(".drop-on").forEach(x=>x!==z&&x.classList.remove("drop-on"));z.classList.add("drop-on");});
document.addEventListener("drop",async e=>{const z=e.target.closest&&e.target.closest(".bcol[data-drop]");if(!z)return;e.preventDefault();z.classList.remove("drop-on");const [col,doc]=(e.dataTransfer.getData("text/plain")||"").split("|");if(!doc||col!==z.dataset.col)return;await aplicarStatus(col,doc,z.dataset.drop);});
document.addEventListener("submit",e=>{if(e.target.id==="enForm"){e.preventDefault();addPedido(e.target);}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.eqin){e.preventDefault();registrarTemp(e.target.dataset.eqin);return;}if(e.key==="Enter"){const c=e.target.closest&&e.target.closest(".kcard");if(c)abrirDetalhe(c.dataset.col,c.dataset.doc);}});
function aplicarVis(){
  const r=S.raw, L=ehLider(), G=verGeral();
  const ok=(it,campo)=>L||(!!S.eu&&(campo==="quem"?ehResp(it,S.eu):contem(it[campo],S.eu)))||(G&&!it.sensivel);
  S.acoes=(r.acoes||[]).filter(x=>ok(x,"quem"));
  S.trilha=(r.trilha||[]).filter(x=>ok(x,"quem"));
  const rp=S.eu?permRot(pessoa(S.eu)):[];
  const IND_ROT={"quebra-de-caixa":"caixa","conciliacao-no-mesmo-dia":"caixa"};
  S.indicadores=(r.indicadores||[]).filter(x=>ok(x,"resp")||(IND_ROT[x._doc]&&rp.includes(IND_ROT[x._doc])));
  ajustarAssinaturas();
  const ids=new Set(S.indicadores.map(i=>i._doc));
  S.lanc=(r.lanc||[]).filter(l=>ids.has(l.indicadorId));
  const alvos=new Set([...S.acoes.map(a=>"acoes/"+a._doc),...S.trilha.map(t=>"trilha/"+t._doc)]);
  S.hist=(r.hist||[]).filter(h=>alvos.has(h.alvo));
}
function assinar(col,key,map){
  return S.db.collection(col).onSnapshot(snap=>{
    const docs=snap.docs.map(d=>({...d.data(),_doc:d.id}));
    if(["acoes","trilha","indicadores","lanc"].includes(key)){S.raw[key]=docs;aplicarVis();} else S[key]=docs;
    if(map)map();
    if(!snap.metadata.fromCache){S.loaded[col]=true; if(["acoes","trilha","indicadores"].every(c=>S.loaded[c])){clearTimeout(S.slowT);S.slow=false;}}
    agendaRender();
  },err=>{ if(err.code==="revoked"){S.db=null;} clearTimeout(S.slowT); agendaRender(); });
}
(async function init(){
  rota();
  if(!window.claude||!window.claude.use){ render(); return; }
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  S.db=db; S.user=user;
  if(user){ try{S.uid=await user.id();}catch(e){} try{S.owner=!!user.isOwner();}catch(e){} try{const c=await user.can("data.write"); if(c===false)S.canWrite=false;}catch(e){} }
  if(!db){ render(); return; }
  S.slowT=setTimeout(()=>{S.slow=true;render();},10000);
  S.sessao=lsGet("sorvely_sessao");
  if(S.uid&&!(S.sessao&&S.sessao.exp>Date.now())){ try{ const g=await db.doc("data/users/"+S.uid+"/sessao").get(); if(g.exists)S.sessao=g.data(); }catch(e){} }
  db.doc("config/geral").onSnapshot(s=>{ if(s.exists)S.geral=s.data(); agendaRender(); },()=>{});
  assinar("acoes","acoes"); assinar("trilha","trilha"); assinar("indicadores","indicadores");
  assinar("lancamentos","lanc"); assinar("propostas","propostas");
  assinar("solicitacoes","solic"); assinar("ordens","ordens"); assinar("produtos","produtos");
  { const cut=iso(addDias(hoje(),-62)); const sub=(col,key)=>db.collection(col).where("data",">=",cut).onSnapshot(sn=>{S[key]=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    S.subRot=sub; sub("temperaturas","tempDias"); sub("checklists","checklists"); ajustarAssinaturas();
    db.collection("ponto").onSnapshot(sn=>{S.ponto=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    db.collection("comunicados").onSnapshot(sn=>{S.comunicados=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    db.collection("ciencias").onSnapshot(sn=>{S.ciencias=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    db.doc("config/checklist").onSnapshot(s=>{S.ckCfg=s.exists?s.data():null;agendaRender();},()=>{});
    db.collection("vendasProduto").onSnapshot(sn=>{S.vendasProd=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    db.collection("estoque").onSnapshot(sn=>{S.estoque=sn.docs.map(d=>({...d.data(),_doc:d.id}));assinarMov();agendaRender();},()=>{});
    db.collection("equipamentos").onSnapshot(sn=>{S.equip=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{}); }
  db.collection("historico").orderBy("em","desc").limit(1500).onSnapshot(snap=>{S.raw.hist=snap.docs.map(d=>({...d.data(),_doc:d.id}));aplicarVis();agendaRender();},()=>{});
  db.collection("usuarios").onSnapshot(snap=>{
    S.usuarios=snap.docs.map(d=>({...d.data(),_doc:d.id}));
    const antes=S.eu; S.eu=sessaoValida(); aplicarVis();
    if(antes&&!S.eu)toast("Sua sessão terminou. Entre de novo.");
    if(!snap.metadata.fromCache&&!S.pediuLogin){S.pediuLogin=true; if(!S.eu)setTimeout(()=>{ if(!$("#dlg").open) entrar(true); },400);}
    agendaRender();
  },()=>{});
  render();
})();
