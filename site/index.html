<title>Acompanhamento Sorvely</title>
<style>
@font-face{font-family:"Poppins";font-style:normal;font-weight:400;font-display:swap;src:url(fontes/poppins-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Poppins";font-style:normal;font-weight:400;font-display:swap;src:url(fontes/poppins-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Poppins";font-style:normal;font-weight:500;font-display:swap;src:url(fontes/poppins-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Poppins";font-style:normal;font-weight:600;font-display:swap;src:url(fontes/poppins-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}

@font-face{font-family:"Coiny";font-style:normal;font-weight:400;font-display:swap;src:url(fontes/coiny-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+1E00-1EFF}
/* Layout: barra fixa com abas; conteúdo em coluna única com cartões, pensado primeiro para celular. */
:root{
  /* Identidade Sorvely (Storm Studio): azul #6593FF, amarelo #FFE783, verde #DAF5B0, marinho #21507A, rosa #F178AD, lavanda #F69BDE */
  --azul:#6593FF; --amarelo:#FFE783; --verde:#DAF5B0; --marinho:#21507A; --rosa:#F178AD; --lavanda:#F69BDE;
  --bg:#F4F7FF; --surface:#ffffff; --ink:#1F1D42; --muted:#5B6085; --line:#DFE6F7;
  --acai:#21507A; --acai-soft:#E4ECFF; --mint:#1f8a74; --rosa-ink:#B32E6B; --rosa-soft:#FDE6F0; --hero:#FFE783; --hero-ink:#1F1D42; --logo:#6593FF;
  --ok:#1f8a4c; --ok-bg:#e4f4ea; --warn:#a86a00; --warn-bg:#fbf0d9; --bad:#c0392b; --bad-bg:#fbe5e2; --idle:#6c6475; --idle-bg:#eeebf1;
  --display:"Coiny", "Poppins", "Segoe UI", system-ui, sans-serif;
  --body:"Poppins", "Segoe UI", system-ui, sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13122B; --surface:#1F1D42; --ink:#F2F4FF; --muted:#A9AECF; --line:#33315E;
    --acai:#9DB8FF; --acai-soft:#2B3270; --mint:#5cc9b1; --rosa-ink:#F7A3C8; --rosa-soft:#40284A; --hero:#2B3270; --hero-ink:#FFE783; --logo:#9DB8FF;
    --ok:#5fd08e; --ok-bg:#1d3326; --warn:#f0b54a; --warn-bg:#3a2e17; --bad:#f08072; --bad-bg:#3d2220; --idle:#a79fb1; --idle-bg:#2b2532;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13122B; --surface:#1F1D42; --ink:#F2F4FF; --muted:#A9AECF; --line:#33315E;
  --acai:#9DB8FF; --acai-soft:#2B3270; --mint:#5cc9b1; --rosa-ink:#F7A3C8; --rosa-soft:#40284A; --hero:#2B3270; --hero-ink:#FFE783; --logo:#9DB8FF;
  --ok:#5fd08e; --ok-bg:#1d3326; --warn:#f0b54a; --warn-bg:#3a2e17; --bad:#f08072; --bad-bg:#3d2220; --idle:#a79fb1; --idle-bg:#2b2532;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acai);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:1.25rem;color:var(--acai)}
.brand span{color:var(--muted);font-size:.85rem}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--bg);cursor:pointer}
.who b{font-weight:700}
.who .lvl{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--acai-soft);color:var(--acai);font-weight:700}
nav.tabs{display:flex;gap:4px;padding:0 12px;max-width:1100px;margin:0 auto;overflow-x:auto}
nav.tabs a{padding:10px 12px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--acai);border-bottom-color:var(--acai)}
nav.tabs a .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:.72rem;text-align:center}

main{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);font-weight:600}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-head h2{margin-right:auto}
.sub{color:var(--muted);font-size:.88rem}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--display);font-size:1.8rem;font-weight:700}
.tile .l{color:var(--muted);font-size:.85rem}
.tile.ok{border-left:5px solid var(--ok)} .tile.warn{border-left:5px solid var(--warn)} .tile.bad{border-left:5px solid var(--bad)} .tile.acai{border-left:5px solid var(--acai)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:8px;font-size:.9rem}
.bar{height:12px;border-radius:6px;background:var(--idle-bg);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}

.limit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.limit:first-of-type{border-top:0}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filt-bar{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.filt-bar>input[type=search]{flex:1;min-width:160px;padding:7px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.filt{flex:0 0 auto}details.filt[open]{flex-basis:100%;order:2}
details.filt summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;color:var(--acai);user-select:none}
details.filt summary::-webkit-details-marker{display:none}details.filt[open] summary{background:var(--acai-soft);border-color:transparent}
.filt-l{display:inline-flex;align-items:center;gap:6px}.filt-n{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--rosa);color:#fff;font-size:.72rem;text-align:center}
details.filt .filters{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.filters select,.filters input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters input[type=search]{flex:1;min-width:160px}
.chk{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}

.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--idle);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.item.s-and{border-left-color:var(--warn)} .item.s-ok{border-left-color:var(--ok)} .item.s-bad{border-left-color:var(--bad)}
.item .id{font-family:var(--display);font-weight:700;color:var(--acai);min-width:38px}
.item .what{font-weight:700}
.item .meta{grid-column:2/4;display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.item .obs{grid-column:2/4;font-size:.88rem;background:var(--bg);border-radius:8px;padding:6px 10px}
.item .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.item.mine{box-shadow:0 0 0 2px var(--acai-soft)}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.p-idle{background:var(--idle-bg);color:var(--idle)} .p-cancel{background:var(--idle-bg);color:var(--idle);text-decoration:line-through} .p-and{background:var(--warn-bg);color:var(--warn)} .p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-acai{background:var(--acai-soft);color:var(--acai)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-Verde{background:var(--ok)} .d-Amarelo{background:var(--warn)} .d-Vermelho{background:var(--bad)} .d-none{background:var(--line)}

select.status{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--acai);background:var(--acai);color:var(--surface);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acai)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
dialog.wide{max-width:820px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acai);color:var(--surface)}
.seg.sm button{padding:4px 10px;font-size:.82rem}
.clic{cursor:pointer}.clic:hover{color:var(--acai);text-decoration:underline}
.prog{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.prog-bar{width:110px;height:8px;border-radius:4px;background:var(--idle-bg);overflow:hidden;display:inline-block}
.prog.mini .prog-bar{width:70px}
.prog-bar i{display:block;height:100%;background:var(--ok)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
.bcol{background:var(--bg);border:1px dashed var(--line);border-radius:var(--r);padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.bcol.drop-on{border-color:var(--acai);background:var(--acai-soft)}
.bcol h3{display:flex;gap:8px;align-items:center;font-size:.95rem}
.bcol-list{display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.kcard[draggable=true]{cursor:grab}.kcard.dragging{opacity:.5}
.kcard:hover{border-color:var(--acai)}
.item.s-cancel,.kcard.s-cancel{opacity:.62}.item.s-cancel .what,.kcard.s-cancel .kc-o{text-decoration:line-through}
.kcard.s-and{border-left-color:var(--warn)}.kcard.s-ok{border-left-color:var(--ok)}.kcard.s-bad{border-left-color:var(--bad)}
.kcard.mine{box-shadow:0 0 0 2px var(--acai-soft)}
.kc-top,.kc-foot{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.kc-top .id{font-family:var(--display);font-weight:700;color:var(--acai)}
.kc-what{font-weight:700;font-size:.9rem}
.kc-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted)}
.empty.sm{padding:10px;font-size:.85rem}
.gantt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gantt{min-width:860px;font-size:.82rem}
.g-row{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--line);min-height:30px}
.g-lab{padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.g-lab .id{font-weight:700;color:var(--acai)}
.g-track{position:relative}
.g-head .g-track{height:28px}
.g-mes{position:absolute;top:6px;padding-left:4px;color:var(--muted);font-size:.75rem;border-left:1px solid var(--line);height:22px}
.g-onda{background:var(--bg)}
.g-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--acai);z-index:1}
.g-bar{position:absolute;top:7px;height:16px;border:0;border-radius:5px;padding:0;cursor:pointer;overflow:hidden;opacity:.9}
.g-bar i{display:block;height:100%;background:rgba(255,255,255,.45)}
.g-orig{position:absolute;top:4px;height:22px;border-left:2px dashed var(--ink);z-index:2}
.det{display:flex;flex-direction:column;gap:12px}
.det-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.det-head h2{margin-top:4px}
.det-head .id{font-family:var(--display);font-weight:700;color:var(--acai)}
.det-status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:5px solid var(--idle)}
.det-status.s-and{border-left-color:var(--warn)}.det-status.s-ok{border-left-color:var(--ok)}.det-status.s-bad{border-left-color:var(--bad)}
.det-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem}
.det-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.det-tabs button{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.det-tabs button.on{color:var(--acai);border-bottom-color:var(--acai)}
.det-body{display:flex;flex-direction:column;gap:10px;min-height:180px}
dl.w5{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0}
dl.w5 dt{font-weight:700;color:var(--muted)}dl.w5 dd{margin:0}
ol.passos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:ps}
ol.passos li{counter-increment:ps;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
ol.passos li.feito{background:var(--ok-bg)}
ol.passos li.feito .ps-chk span{text-decoration:line-through;color:var(--muted)}
.ps-chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.ps-chk::before{content:counter(ps)".";font-weight:700;color:var(--acai);min-width:18px}
.ps-chk input{margin-top:3px}
.ps-meta{grid-column:1/2;display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding-left:26px}
.ps-meta .atras{color:var(--bad);font-weight:700}
.ps-act{grid-column:2/3;grid-row:1/3;display:flex;gap:4px;align-items:flex-start}
.add-passo{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.add-passo .field,.add-passo .row2{width:100%}
.banner.ok-b{background:var(--ok-bg);color:var(--ok);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nota-box{display:flex;flex-direction:column;gap:6px}
.nota-box textarea{min-height:70px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
ul.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
ul.tl li{position:relative;font-size:.9rem}
ul.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--idle);border:2px solid var(--surface)}
ul.tl li.tl-nota::before{background:var(--acai)}ul.tl li.tl-status::before{background:var(--warn)}ul.tl li.tl-alteracao::before,ul.tl li.tl-criacao::before{background:var(--mint)}ul.tl li.tl-prazo::before{background:var(--bad)}ul.tl li.tl-passo::before{background:var(--ok)}
ul.tl li.empty::before{display:none}
ul.tl .tl-campos li::before{display:none}
ul.tl .tl-campos li{list-style:disc}
.tl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-tipo{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tl-nota{background:var(--acai-soft);border-radius:10px;padding:8px 10px;margin-top:4px;white-space:pre-wrap}
.tl-campos{margin:4px 0 0;padding-left:18px}
.tl-campos s{color:var(--muted)}
ul.feed{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.feed-it{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem}
.feed-it:hover{background:var(--bg)}
.feed-it .id{font-family:var(--display);font-weight:700;color:var(--acai);min-width:34px}
@media (max-width:520px){dl.w5{grid-template-columns:1fr}.g-row{grid-template-columns:150px 1fr}.ps-act{grid-column:1/2;grid-row:auto}}
.it-list{display:flex;flex-direction:column;gap:6px}
.it-row{display:grid;grid-template-columns:1fr 80px 130px auto;gap:6px;align-items:center}
.it-row input,.it-row select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
fieldset.perm{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;margin:0}
fieldset.perm legend{font-weight:700;font-size:.85rem;padding:0 4px}
td.atras,.num.atras{color:var(--bad);font-weight:700}
.item .id input{margin-right:4px}
@media (max-width:520px){.it-row{grid-template-columns:1fr 70px;}.it-row .it-u{grid-column:1/2}}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
table.cx input{width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
table.cx tr.tot td{border-top:2px solid var(--line)}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--warn);font-weight:700}
.cx-res{font-weight:700;display:flex;gap:8px;align-items:center}
.card.quick{display:flex;flex-direction:column;gap:10px}
.q-grid{display:grid;grid-template-columns:1fr 1.2fr .8fr 1.2fr 1.2fr .8fr;gap:8px}
.q-grid input,.q-grid select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
tr.rota td{background:var(--warn-bg)}
td.acts{display:flex;gap:4px;align-items:center}
.stk-h{margin:16px 0 8px;display:flex;gap:8px;align-items:baseline}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}

/* Dicas discretas */
details.dica{margin:2px 0 10px}
details.dica>summary{display:inline-flex;align-items:center;gap:5px;cursor:pointer;list-style:none;color:var(--muted);font-size:.8rem;font-weight:500;padding:3px 8px 3px 4px;border-radius:999px}
details.dica>summary::-webkit-details-marker{display:none}
details.dica>summary:hover{color:var(--acai);background:var(--acai-soft)}
details.dica[open]>summary{color:var(--acai)}
.dica-c{margin-top:6px;padding:9px 12px;border-left:3px solid var(--azul);background:var(--surface);border-radius:0 10px 10px 0;font-size:.86rem;line-height:1.5;color:var(--ink);max-width:70ch}
/* Painel */
.pn-acts{display:flex;gap:6px;margin-left:auto}
.pn-hero{display:flex;flex-direction:column;gap:12px}
.pn-k{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pn-v{display:flex;align-items:baseline;gap:6px;margin:2px 0}
.pn-v b{font:400 2.4rem/1 var(--display);color:var(--acai)}
.pn-v span{color:var(--muted);font-weight:600}
.pn-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--idle-bg);gap:2px}
.pn-bar i{display:block;min-width:4px}
.pn-bar .k-ok{background:var(--ok)}.pn-bar .k-and{background:var(--warn)}.pn-bar .k-idle{background:color-mix(in srgb,var(--idle) 35%,var(--idle-bg))}.pn-bar .k-bad{background:var(--bad)}
.pn-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pchip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.pchip:hover{background:var(--bg)}
.pchip b{font-size:1.35rem;line-height:1.1}.pchip span{font-size:.78rem;color:var(--muted)}
.c-ok{--c:var(--ok)}.c-and{--c:var(--warn)}.c-idle{--c:var(--idle)}.c-bad{--c:var(--bad)}
.sd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.card h3+.sd,.card .sub+.sd{border-top:0}
.sd>div{display:flex;flex-direction:column;min-width:0}.sd .sub{font-size:.78rem}
.sd .pill{flex:none;white-space:nowrap}
.sd-v{display:flex;gap:8px;align-items:center}
details.pn-det{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.pn-det>summary{cursor:pointer;font-weight:600;color:var(--acai);font-size:.92rem}
details.pn-det[open]>summary{margin-bottom:8px}
@media (max-width:600px){.pn-chips{grid-template-columns:1fr 1fr}.pn-acts{margin-left:0}}
/* Atalhos essenciais */
.atalhos2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.at2{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 12px 11px;min-height:86px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.at2:hover{border-color:var(--azul)}
.at2:active{transform:scale(.98)}
.at2-i{width:24px;height:24px;color:var(--acai)}
.at2-t{font-weight:600;font-size:.92rem;line-height:1.2}
.at2-s{font-size:.75rem;color:var(--muted);margin-top:-3px}
.at2 .badge{position:absolute;top:9px;right:9px;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--rosa);color:#fff;font-size:.72rem;font-weight:700;text-align:center}
.at2.tem{border-color:color-mix(in srgb,var(--rosa) 55%,var(--line))}
details.at-mais{margin-top:8px}
details.at-mais summary{cursor:pointer;color:var(--acai);font-weight:600;font-size:.85rem;padding:6px 2px;list-style:none;display:inline-flex;align-items:center;gap:4px}
details.at-mais summary::-webkit-details-marker{display:none}
details.at-mais summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.at-mais[open] summary::after{transform:rotate(225deg)}
details.at-mais .atalhos2{margin-top:6px}
@media (max-width:600px){.atalhos2{grid-template-columns:repeat(3,1fr);gap:6px}.at2{min-height:78px;padding:10px 8px 9px;gap:5px;align-items:center;text-align:center}.at2-t{font-size:.8rem}.at2-s{font-size:.68rem}.at2-i{width:22px;height:22px}.at2 .badge{top:5px;right:5px}}
@media (prefers-reduced-motion: reduce){details.at-mais summary::after{transition:none}}
/* Para fazer hoje */
.pend-card{padding:14px 16px}
.pend-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pend-tg{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--ink);cursor:pointer;font:inherit}
.pend-tg h3{margin:0;display:flex;align-items:center;gap:8px}
.pend-tg svg{color:var(--muted);transition:transform .15s}
.pend-min .pend-tg svg{transform:rotate(-90deg)}
.pend-n{display:inline-block;min-width:22px;padding:1px 7px;border-radius:11px;background:var(--acai-soft);color:var(--acai);font-size:.78rem;text-align:center}
.pend-res{display:flex;gap:6px;flex-wrap:wrap}
.ps{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px}
.ps-bad{background:var(--bad-bg);color:var(--bad)}.ps-and{background:var(--warn-bg);color:var(--warn)}.ps-idle{background:var(--idle-bg);color:var(--idle)}
.pend-cats{display:flex;gap:6px;margin:10px 0 2px;overflow-x:auto;scrollbar-width:none}
.pend-cats::-webkit-scrollbar{display:none}
.pc{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font:500 .82rem var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pc span{color:var(--muted);font-size:.74rem}
.pc.on{background:var(--acai);border-color:var(--acai);color:#fff}.pc.on span{color:rgba(255,255,255,.8)}
ul.pend2{list-style:none;margin:8px 0 0;padding:0}
.pr{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr-go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 4px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font:inherit;border-radius:10px}
.pr-go:hover{background:var(--bg)}
.pr-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--idle)}
.pr-bad .pr-dot{background:var(--bad)}.pr-and .pr-dot{background:var(--warn)}
.pr-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pr-t{font-weight:600;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr-bad .pr-t{color:var(--bad)}
.pr-d{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-ch{flex:none;color:var(--muted)}
.pr-x{flex:none;width:36px;border:0;background:none;color:var(--muted);font-size:1.15rem;cursor:pointer;border-radius:10px}
.pr-x:hover{background:var(--bg);color:var(--ink)}
.pr-oc{opacity:.55}
.pend-pe{display:flex;justify-content:space-between;align-items:center;margin-top:6px;min-height:20px}
.pend-pe .linkbtn{font-size:.82rem;color:var(--acai);text-decoration:none;font-weight:600;opacity:1}
.pend-vazio{display:flex;align-items:center;gap:8px;margin:8px 0 2px;color:var(--ok);font-weight:600}
.pend-ok{padding:12px 16px}
@media (prefers-reduced-motion: reduce){.pend-tg svg{transition:none}}
/* ===== Layout limpo + menu lateral ===== */
:root{--side:240px;--side-min:76px;--hdr:58px}
body{background:var(--bg)}
.top-row{gap:10px;min-height:var(--hdr)}
.menu-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;margin-left:-6px;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;flex:none}
.menu-btn:hover{background:var(--acai-soft)}
.menu-dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--rosa);border:2px solid var(--surface)}
.brand span{display:none}
/* navegação */
nav.tabs{display:flex;flex-direction:column;gap:2px;margin:0;max-width:none;background:var(--surface);overflow-y:auto;overflow-x:hidden}
nav.tabs a,nav.tabs .nav-aj{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:12px;text-decoration:none;color:var(--ink);font:500 .95rem/1.2 var(--body);white-space:nowrap;position:relative;background:none;cursor:pointer;text-align:left;width:100%}
nav.tabs a[hidden]{display:none}
nav.tabs .ti{display:block;width:22px;height:22px;flex:none;color:var(--muted)}
nav.tabs a:hover,nav.tabs .nav-aj:hover{background:var(--bg)}
nav.tabs a.on{background:var(--acai-soft);color:var(--acai);font-weight:600}
nav.tabs a.on .ti{color:var(--acai)}
nav.tabs a .badge{margin-left:auto;position:static}
.nav-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.nav-ver{font-size:.7rem;color:var(--muted);padding:4px 12px 2px;opacity:.8}
#navBack{position:fixed;inset:0;background:rgba(31,29,66,.42);z-index:49}
body.nav-open header.top{z-index:60}
header.top>.top-row>.ajuda{display:none}
@media (min-width:1000px){
  nav.tabs{position:fixed;top:var(--hdr);left:0;bottom:0;width:var(--side);padding:14px 12px;border-right:1px solid var(--line);z-index:9;transition:width .15s ease}
  main{max-width:none;margin:0 0 0 var(--side);padding:24px max(24px,calc((100vw - var(--side) - 1040px)/2)) 40px;transition:margin .15s ease}
  body.nav-min nav.tabs{width:var(--side-min)}
  body.nav-min main{margin-left:var(--side-min);padding-left:max(24px,calc((100vw - var(--side-min) - 1040px)/2));padding-right:max(24px,calc((100vw - var(--side-min) - 1040px)/2))}
  body.nav-min nav.tabs .tl-l,body.nav-min .nav-ver{display:none}
  body.nav-min nav.tabs a,body.nav-min nav.tabs .nav-aj{justify-content:center;padding:10px}
  body.nav-min nav.tabs a .badge{position:absolute;top:4px;right:6px;margin:0;font-size:.62rem;min-width:16px}
  .top-row{max-width:none;padding:0 20px}
}
@media (max-width:999px){
  nav.tabs{position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);padding:calc(16px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));z-index:50;transform:translateX(-104%);transition:transform .22s ease;box-shadow:8px 0 30px rgba(31,29,66,.2);border-radius:0 20px 20px 0}
  body.nav-open nav.tabs{transform:none}
  body.nav-open{overflow:hidden}
  nav.tabs a,nav.tabs .nav-aj{padding:13px 14px;font-size:1rem}
}
@media (prefers-reduced-motion: reduce){nav.tabs,main{transition:none}}
/* visual mais limpo */
.btn{font-family:var(--body);font-weight:600;letter-spacing:0;box-shadow:none!important}
.btn:not(.ghost):not(.danger):hover{filter:brightness(1.08)}
.card{border:1px solid var(--line);box-shadow:none;padding:18px}
.card.hero{border:0}
.at-t{font-family:var(--body);font-weight:700;font-size:1rem;color:var(--ink)}
.atalho{border:1px solid var(--line);box-shadow:none;background:var(--surface)}
.atalho:hover{border-color:var(--azul)}
.atalho.forte{border:1.5px solid var(--azul);background:var(--surface)}
.at-d{color:var(--muted)}
h3.sec{font-family:var(--body);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile{border:1px solid var(--line);box-shadow:none}
.tile .v{font-family:var(--body);font-weight:700}
.section-head h2{font-size:1.45rem}
.card h3{font-size:1.02rem}
.sub{color:var(--muted)}
/* registros com foto */
.fotos-topo{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fotos-topo h3{margin:0 0 4px}.fotos-topo .sub{margin:0;max-width:560px}
.fotos-topo .btn{display:inline-flex;align-items:center;gap:8px}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.foto-it{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;cursor:pointer;font:inherit;color:inherit}
.foto-it:hover{border-color:var(--azul)}
.foto-th{position:relative;display:block;aspect-ratio:4/3;background:var(--bg)}
.foto-th img{width:100%;height:100%;object-fit:cover;display:block}
.foto-n{position:absolute;right:8px;bottom:8px;background:rgba(31,29,66,.75);color:#fff;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px}
.foto-tx{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px}
.foto-obs{font-size:.86rem;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foto-prev{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.fp{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.fp img{width:100%;height:100%;object-fit:cover}
.fp-x{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(31,29,66,.75);color:#fff;font-size:1rem;line-height:1;cursor:pointer}
.foto-add{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.foto-add[hidden]{display:none}
.lbl{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.foto-full{display:flex;flex-direction:column;gap:10px}
.foto-full img{width:100%;border-radius:12px;background:var(--bg)}
@media (max-width:600px){.foto-grid{grid-template-columns:1fr 1fr;gap:8px}.foto-tx{padding:8px 10px 10px}.foto-tx .sub{font-size:.75rem}.fotos-topo .btn{width:100%;justify-content:center}}

async function gravar(fn,okMsg){

  if(navigator.onLine===false){toast("Sem internet. Nada foi salvo. Tente de novo quando a conexão voltar.");return false;}
  try{ await fn(); if(okMsg)toast(okMsg); return true; }
  catch(e){
    if(e&&e.code==="cancel")return false;
    if(e&&e.code==="permission-denied"){ toast("Você não tem permissão para fazer isso."); }
    else if(e&&e.code==="invalid_argument"){ S.canWrite=false; render(); toast("Você só tem acesso de leitura. Peça ao Marco acesso de edição."); }
    else if(e&&e.code==="unavailable"){ toast("Falha momentânea de conexão. Tente de novo."); }

    return false;
  }
}

function cardRecentes(){
  const l=S.hist.slice().sort((a,b)=>(b.em||"").localeCompare(a.em||"")).slice(0,8);
  if(!l.length)return "";
  const txt=h=>h.tipo==="status"?`mudou o status para <b>${esc(h.para)}</b>`:h.tipo==="nota"?`escreveu: “${esc(String(h.texto).slice(0,90))}${String(h.texto).length>90?"…":""}”`:h.tipo==="alteracao"?`alterou ${esc((h.campos||[]).map(c=>c.campo.toLowerCase()).join(", "))}`:h.tipo==="prazo"?`registrou prazo não cumprido (novo prazo ${fmtD(parseISO(h.para))})`:esc((h.texto||"").toLowerCase());

}
function cardMotivos(){

function lerColecao(c){
  return new Promise((res,rej)=>{let un=null,fim=false;
    const ok=sn=>{if(fim)return;fim=true;clearTimeout(t);setTimeout(()=>un&&un(),0);res(Object.fromEntries(sn.docs.map(d=>{const x={...d.data()};if(c==="usuarios"){delete x.pinHash;delete x.pinSalt;}return [d.id,x];})));};
    let ult=null; const t=setTimeout(()=>{ if(ult)ok(ult); else {fim=true;rej(new Error(c));} },20000);
    un=S.db.collection(c).onSnapshot({includeMetadataChanges:true},sn=>{ult=sn; if(!(sn.metadata&&sn.metadata.fromCache))ok(sn);},e=>{if(!fim){fim=true;clearTimeout(t);rej(e);}});
  });
}
async function baixarBackup(btn){
  if(!ehLider()||!S.db)return;
  const dl=await claude.use("downloads").catch(()=>null);
  if(!dl){toast("O download não está disponível nesta tela.");return;}
  btn.disabled=true; const txt=btn.textContent; btn.textContent="Gerando...";
  try{
    const out={app:"Sorvely",versao:1,em:new Date().toISOString(),por:quemSou(),dados:{}};
    for(const c of COLS_BKP) out.dados[c]=await lerColecao(c);
    const data=new TextEncoder().encode(JSON.stringify(out));
    await dl.save({filename:`Sorvely_backup_${iso(hoje())}.json`,data:data.buffer});
    toast("Backup baixado. Os PINs não vão no arquivo.");
  }catch(e){ toast("Não consegui gerar o backup ("+(e&&(e.code||e.message)||"erro")+")."); }
  finally{ btn.disabled=false; btn.textContent=txt; }
}

/* ---------- Atividades: visualizações, ficha, passos, observações e histórico ---------- */
const ROT_CAMPOS={oque:"O que",porque:"Por quê",onde:"Onde",quem:"Quem",como:"Como",quanto:"Quanto custa",criterio:"Pronto quando",diaIni:"Início previsto",diaFim:"Fim previsto",obs:"Observações fixas",rotina:"Virou rotina",categoria:"Categoria",prazo:"Prazo",prazoTexto:"Prazo (texto)",custo:"Custo",preco:"Preço de venda",aprovada:"Aprovada pela proprietária",sensivel:"Sensível",responsaveis:"Responsáveis"};
function fmtCampo(k,v){
  if(Array.isArray(v))return v.length?v.join(", "):"ninguém";
  if(v===undefined||v===null||v==="")return "vazio";
  if(k==="diaIni"||k==="diaFim")return fmtD(addDias(basePlano(),Number(v)-1));
  if(k==="prazo")return fmtD(parseISO(v));
  if(k==="rotina"||k==="aprovada"||k==="sensivel")return v?"Sim":"Não";
  if(k==="custo"||k==="preco"||k==="quanto")return fmtQuanto(v);
  return String(v);
}
function colecao(col){return col==="acoes"?S.acoes:S.trilha;}
function pedirTexto(titulo,sub,rotulo,exemplo,opcional,botao){
  return new Promise(res=>{
    let feito=false; const fim=v=>{if(!feito){feito=true;res(v);}};
    setTimeout(()=>{
      abrirDlg(`<h2>${esc(titulo)}</h2>${sub?`<p><b>${esc(sub)}</b></p>`:""}
        <div class="field"><label for="pt_t">${esc(rotulo)}</label><textarea id="pt_t" name="t" rows="3" placeholder="${esc(exemplo||"")}" ${opcional?"":"required"}></textarea></div>
        <div class="dlg-foot"><button class="btn ghost" value="cancel" formnovalidate>Voltar</button><button class="btn${opcional?" danger":""}" value="ok">${esc(botao||"Confirmar")}</button></div>`,
      async fd=>{const v=String(fd.get("t")||"").trim(); if(!v&&!opcional)return false; fim(opcional?{texto:v}:v);});
      $("#dlg").addEventListener("close",()=>fim(""),{once:true});
    },0);
  });
}
function itemDe(col,doc){return colecao(col).find(x=>x._doc===doc);}
function histDe(col,doc){return S.hist.filter(h=>h.alvo===col+"/"+doc).sort((a,b)=>(b.em||"").localeCompare(a.em||""));}
function logHist(col,item,e){
  if(!S.db)return;
  S.db.collection("historico").add({alvo:col+"/"+item._doc,itemId:item.id||"",itemOque:item.oque||"",por:quemSou(),em:new Date().toISOString(),...e}).catch(()=>{});
}
function quando(isoStr){
  if(!isoStr)return "";
  const d=new Date(isoStr), min=Math.round((Date.now()-d)/60000);
  if(min<1)return "agora";
  if(min<60)return "há "+min+" min";
  if(min<60*24)return "há "+Math.round(min/60)+" h";
  if(min<60*24*7)return "há "+Math.round(min/1440)+" dia"+(Math.round(min/1440)>1?"s":"");
  return fmtD(d);
}
function progresso(it){const p=it.passos||[];if(!p.length)return null;const f=p.filter(x=>x.feito).length;return {f,t:p.length,pct:Math.round(f/p.length*100)};}
function barraProg(it,mini){const pr=progresso(it);if(!pr)return "";return `<span class="prog ${mini?"mini":""}" title="${pr.f} de ${pr.t} passos"><span class="prog-bar"><i style="width:${pr.pct}%"></i></span><span class="num">${pr.f}/${pr.t} passos</span></span>`;}
function quemDefiniu(it){
  if(it.statusPor)return `${esc(it.status)} · definido por <b>${esc(it.statusPor)}</b> ${quando(it.statusEm)}`;
  return "";
}

/* ---- mudar status (lista, quadro, ficha) ---- */
async function aplicarStatus(col,doc,novo){
  const it=itemDe(col,doc); if(!it)return false;
  if(novo===it.status)return true;
  if(!podeEditarItem(it)){toast(S.eu?"Você só pode mudar as atividades em que seu nome aparece.":"Entre com seu nome e PIN para alterar.");if(!S.eu)entrar(false);return false;}
  if((novo==="Cancelada"||it.status==="Cancelada")&&!ehLider()){toast(novo==="Cancelada"?"Só a Liderança pode cancelar uma atividade.":"Esta atividade foi cancelada. Só a Liderança pode reativar.");return false;}
  let extra={}, motivo="";
  if(novo==="Cancelada"){
    motivo=await pedirTexto("Cancelar atividade",`${it.id} ${it.oque}`,"Por que esta atividade foi cancelada?","ex.: substituída pela ação 2.4; não faz mais sentido depois da reforma");
    if(!motivo)return false;
    extra={motivoCancel:motivo,canceladaEm:iso(hoje()),canceladaPor:quemSou()};
  } else if(it.status==="Cancelada") extra={motivoCancel:null,canceladaEm:null,canceladaPor:null};
  if(!(await validarStatus(col,it,novo)))return false;
  const ok=await gravar(()=>S.db.doc(col+"/"+doc).update({...camposStatus(it,novo),...extra,atualizado:carimbo()}),novo==="Cancelada"?"Atividade cancelada.":it.status==="Cancelada"?"Atividade reativada como "+novo+".":"Status alterado para "+novo+".");
  if(ok)logHist(col,it,{tipo:"status",de:it.status,para:novo,...(motivo?{texto:motivo}:{})});
  return ok;
}
async function salvarComHist(col,it,d,msg){
  const campos=Object.keys(ROT_CAMPOS).filter(k=>k in d&&String(d[k]??"")!==String(it[k]??"")).map(k=>({campo:ROT_CAMPOS[k],de:fmtCampo(k,it[k]),para:fmtCampo(k,d[k])}));
  const ok=await gravar(()=>S.db.doc(col+"/"+it._doc).update(d),msg);
  if(ok){
    if(d.status&&d.status!==it.status)logHist(col,it,{tipo:"status",de:it.status,para:d.status});
    if(campos.length)logHist(col,it,{tipo:"alteracao",campos});
  }
  return ok;
}

function vCronograma(lista){

  ini.setDate(1); const fimM=new Date(fim.getFullYear(),fim.getMonth()+1,1);
  const tot=(fimM-ini)/864e5, x=d=>((d-ini)/864e5)/tot*100;
  const meses=[]; for(let d=new Date(ini);d<fimM;d=new Date(d.getFullYear(),d.getMonth()+1,1))meses.push(new Date(d));
  const cor={"Concluída":"var(--ok)","Em andamento":"var(--warn)","Atrasada":"var(--bad)","Não iniciada":"var(--idle)","Cancelada":"var(--line)"};

async function acaoDetalhe(b){
  const {col,doc}=S.detalhe, it=itemDe(col,doc); if(!it)return;
  const k=b.dataset.det, i=Number(b.dataset.i), p=(it.passos||[]).map(x=>({...x}));
  if(k==="fechar"){$("#dlg").close();return;}
  if(k==="aba"){S.detalhe.aba=b.dataset.aba;atualizarDetalhe();return;}
  if(k==="filtro"){S.detalhe.filtro=b.dataset.f;atualizarDetalhe();return;}
  if(k==="prazo"){$("#dlg").close();setTimeout(()=>naoDeu(col,doc),0);return;}
  if(k==="aprovar"){b.disabled=true;await aprovarProduto(it);return;}
  if(k==="editar"){$("#dlg").close();setTimeout(()=>(col==="acoes"?formAcao(it):formTrilha(it)),0);return;}
  if(k==="concluir"){await aplicarStatus(col,doc,"Concluída");return;}
  if(k==="nota-add"){
    const t=($("#nt_txt").value||"").trim(); if(!t){toast("Escreva a observação antes de publicar.");return;}
    S.detalhe.rascunho=""; $("#nt_txt").value="";
    S.db.collection("historico").add({alvo:col+"/"+doc,itemId:it.id,itemOque:it.oque,tipo:"nota",texto:t,por:quemSou(),em:new Date().toISOString()}).then(()=>toast("Observação publicada.")).catch(()=>{toast("Não foi possível publicar.");S.detalhe.rascunho=t;});
    return;
  }
  if(k==="nota-del"){const id=b.dataset.id; if(await pergunta("Apagar observação","A observação some para todo mundo. Continuar?","Apagar"))gravar(()=>S.db.doc("historico/"+id).delete(),"Observação apagada.");return;}
  if(k==="passo-add"){
    const t=($("#ps_txt").value||"").trim(); if(!t){toast("Escreva o passo.");return;}
    p.push({id:Date.now().toString(36),texto:t,resp:($("#ps_resp").value||"").trim(),prazo:$("#ps_pz").value||"",feito:false,criadoPor:quemSou()});
    await salvarPassos(it,p,"Adicionou o passo: "+t); return;
  }
  if(k==="passo-ok"){
    const s=p[i]; s.feito=b.checked; s.feitoPor=b.checked?quemSou():""; s.feitoEm=b.checked?new Date().toISOString():"";
    const ok=await salvarPassos(it,p,(b.checked?"Concluiu o passo: ":"Reabriu o passo: ")+s.texto);
    if(ok&&b.checked&&it.status==="Não iniciada"&&podeEditarItem(it)) toast("Dica: mude o status da atividade para Em andamento.");
    return;
  }
  if(k==="passo-up"||k==="passo-down"){const j=k==="passo-up"?i-1:i+1;[p[i],p[j]]=[p[j],p[i]];await salvarPassos(it,p,"");return;}
  if(k==="passo-del"){const s=p[i];if(!(await pergunta("Remover passo",`Remover o passo "${s.texto}"?`,"Remover")))return;p.splice(i,1);await salvarPassos(it,p,"Removeu o passo: "+s.texto);return;}
  if(k==="passo-edit"){
    const s=p[i];
    const r=await dlg2(`<h2>Editar passo</h2><div class="field"><label for="pe_t">Passo</label><input id="pe_t" name="t" value="${esc(s.texto)}"></div>
      <div class="row2"><div class="field"><label for="pe_r">Responsável</label><input id="pe_r" name="r" value="${esc(s.resp||"")}"></div><div class="field"><label for="pe_p">Prazo</label><input id="pe_p" type="date" name="p" value="${esc(s.prazo||"")}"></div></div>
      <div class="dlg-foot"><button class="btn ghost" value="cancel">Cancelar</button><button class="btn" value="ok">Salvar</button></div>`);
    if(!r)return;
    const nt=($("#pe_t").value||"").trim()||s.texto, ant=s.texto;
    s.texto=nt; s.resp=($("#pe_r").value||"").trim(); s.prazo=$("#pe_p").value||"";
    await salvarPassos(it,p,nt!==ant?`Editou o passo: ${ant} → ${nt}`:"Editou o passo: "+nt); return;
  }
}

/* ---------- Produção: solicitações da loja, ordens de produção, envio e recebimento ---------- */
const UNIDADES=["balde 10L","cuba","caixa 10L","pote 500g","pote 1L","pote 1,5L","picolé (unid.)","unidade","kg","L","pacote"];
const ST_OP=["Emitida","Em produção","Produzida","Enviada","Recebida"];
const CLS_OP={"Emitida":"idle","Em produção":"and","Produzida":"acai","Enviada":"and","Recebida":"ok","Cancelada":"bad"};
const CLS_SOL={"Aberta":"and","Em ordem":"acai","Atendida":"ok","Recusada":"bad","Cancelada":"idle"};
const PERM_ROT={solicitar:"Solicita produção (loja)",emitir:"Emite ordens de produção",produzir:"Produz e envia (fábrica)"};
function permProd(p){
  if(!p||p.ativo===false)return [];
  if(p.nivel==="Liderança")return ["solicitar","emitir","produzir"];
  if(Array.isArray(p.producao))return p.producao;
  const r=[], papel=String(p.papel||"").toLowerCase();
  if(papel.includes("loja"))r.push("solicitar");
  if(papel.includes("fábrica")||papel.includes("fabrica"))r.push("produzir");
  return r;
}
const podeProd=x=>S.canWrite&&!!S.eu&&permProd(pessoa(S.eu)).includes(x);
const veProducao=()=>!!S.eu&&permProd(pessoa(S.eu)).length>0;
const fmtQtd=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
const itensTxt=it=>(it||[]).map(i=>`${fmtQtd(i.qtd)} ${i.unidade} de ${i.produto}`).join("; ");
function proxNum(lista,pref){return pref+String(Math.max(0,...lista.map(x=>Number(String(x.num||"").replace(/\D/g,""))||0))+1).padStart(4,"0");}
function pendProducao(){
  if(!S.eu)return 0; const p=permProd(pessoa(S.eu)); let n=0;
  if(p.includes("emitir"))n+=S.solic.filter(s=>s.status==="Aberta").length;
  if(p.includes("produzir"))n+=S.ordens.filter(o=>o.status==="Emitida").length;
  if(p.includes("solicitar"))n+=S.ordens.filter(o=>o.status==="Enviada").length;
  return n;
}

function vProducao(){
  if(!veProducao())return `<div class="card"><h2>Produção</h2><p class="sub">${S.eu?"Seu usuário não participa do controle de produção. Se precisar, fale com o Marco.":"Entre com seu nome e PIN para ver a produção."}</p>${S.eu?"":'<p><button class="btn" data-act="entrar">Entrar</button></p>'}</div>`;
  const p=permProd(pessoa(S.eu));
  const padrao=p.includes("produzir")&&!p.includes("emitir")?"ordens":"solic";
  let sub=S.f.prod.sub||padrao; if(sub==="solic"&&!(p.includes("solicitar")||p.includes("emitir")))sub="ordens"; if(sub==="produtos"&&!ehLider())sub=padrao;
  const abertas=S.solic.filter(s=>s.status==="Aberta").length, emitidas=S.ordens.filter(o=>o.status==="Emitida").length, emProd=S.ordens.filter(o=>o.status==="Em produção").length, enviadas=S.ordens.filter(o=>o.status==="Enviada").length;
  return `<div class="section-head"><h2>Produção</h2>
    <div class="seg">${[...(p.includes("solicitar")||p.includes("emitir")?[["solic","Solicitações da loja"]]:[]),["ordens","Ordens de produção"],...(ehLider()?[["produtos","Produtos"]]:[])].map(([k,l])=>`<button type="button" class="${sub===k?"on":""}" data-psub="${k}">${l}</button>`).join("")}</div>

    ${podeProd("emitir")?'<button class="btn ghost" data-act="novaOP">Nova ordem</button>':""}</div>

    ${p.includes("solicitar")||p.includes("emitir")?`<div class="tile ${abertas?"warn":""}"><span class="v num">${abertas}</span><span class="l">solicitações aguardando ordem</span></div>`:""}
    <div class="tile ${emitidas?"warn":""}"><span class="v num">${emitidas}</span><span class="l">ordens emitidas para produzir</span></div>
    <div class="tile acai"><span class="v num">${emProd}</span><span class="l">ordens em produção</span></div>

  ${sub==="ordens"?vOrdens():sub==="produtos"?vProdutos():vSolic()}`;
}
function ajudaProducao(p){
  const t=[];
  if(p.includes("solicitar"))t.push("<b>Loja:</b> use <b>Nova solicitação</b> para pedir o que está faltando. Quando a ordem chegar como <b>Enviada</b>, confira e clique em <b>Confirmar recebimento</b>.");

function linhaItem(i,it){return `<div class="it-row" data-i="${i}">

function ligarItens(f){
  const lista=f.querySelector(".it-list");
  f.querySelector(".it-add").addEventListener("click",()=>{lista.insertAdjacentHTML("beforeend",linhaItem(lista.children.length,{}));lista.lastElementChild.querySelector(".it-p").focus();});
  lista.addEventListener("click",e=>{const b=e.target.closest(".it-del");if(!b)return;if(lista.children.length>1)b.closest(".it-row").remove();else b.closest(".it-row").querySelectorAll("input").forEach(x=>x.value="");});
  lista.addEventListener("change",e=>{if(!e.target.classList.contains("it-p"))return;const pr=S.produtos.find(p=>p.nome.toLowerCase()===e.target.value.trim().toLowerCase());if(pr&&pr.unidade)e.target.closest(".it-row").querySelector(".it-u").value=pr.unidade;});
}
function lerItens(f){
  const out=[]; let erro="";
  f.querySelectorAll(".it-row").forEach(r=>{
    const produto=r.querySelector(".it-p").value.trim(), q=r.querySelector(".it-q").value.trim(), unidade=r.querySelector(".it-u").value;
    if(!produto&&!q)return;
    const qtd=parseNum(q);
    if(!produto)erro="Preencha o produto de todos os itens.";
    else if(isNaN(qtd)||qtd<=0)erro=`Informe a quantidade de ${produto}.`;
    else out.push({produto,qtd,unidade});
  });
  if(!erro&&!out.length)erro="Adicione pelo menos um item.";
  return {itens:out,erro};
}

const FORMAS=["Dinheiro","Pix","Cartão de débito","Cartão de crédito","Vale-refeição/alimentação","Outros"];
const CANAIS=["Delivery próprio","Aiqfome","Pede Aí","Outro"];

const EQUIP_SUGERIDOS={
  "Sorveteria":[["Vitrine de sorvete",-18,-12],["Freezer horizontal 1",-22,-18],["Freezer horizontal 2",-22,-18],["Câmara fria",-25,-18],["Geladeira de insumos",0,5]],

};
function permRot(p){
  if(!p||p.ativo===false)return [];
  if(p.nivel==="Liderança")return ["checklist","caixa","temperatura","estoque","fotos"];
  if(Array.isArray(p.rotinas))return [...p.rotinas.filter(x=>x!=="entregas"&&x!=="fotos"),"fotos"];
  const papel=String(p.papel||"").toLowerCase(), r=[];
  if(papel.includes("loja"))r.push("checklist","caixa","temperatura","estoque");
  if(papel.includes("fábrica")||papel.includes("fabrica"))r.push("temperatura");
  r.push("fotos");
  return [...new Set(r)];
}
const podeRot=x=>S.canWrite&&!!S.eu&&permRot(pessoa(S.eu)).includes(x);
const veRotinas=()=>!!S.eu&&permRot(pessoa(S.eu)).length>0;
function locaisTemp(){
  const p=pessoa(S.eu); if(!p)return [];
  if(p.nivel==="Liderança")return ["Sorveteria","Fábrica"];
  const papel=String(p.papel||"").toLowerCase(), l=[];
  if(papel.includes("loja"))l.push("Sorveteria");
  if(papel.includes("fábrica")||papel.includes("fabrica"))l.push("Fábrica");
  return l.length?l:["Sorveteria","Fábrica"];
}
const agoraHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
function minEntre(a,b){if(!a||!b)return null;const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);let d=(h2*60+m2)-(h1*60+m1);if(d<0)d+=1440;return d;}
const brl=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const indRaw=id=>(S.raw.indicadores||[]).find(x=>x._doc===id);
async function lancAuto(indId,data,valor,obs){
  const i=indRaw(indId); if(!i||!S.db)return;
  const ref=S.db.doc("lancamentos/auto-"+indId+"-"+data);
  try{
    if(valor===null){await ref.delete();return;}
    const v=Math.round(valor*100)/100, farol=farolAuto(v,i.direcao,i.limVerde,i.limAmarelo)||"Amarelo";
    await ref.set({dataRef:data,indicadorId:indId,indicador:i.nome,perspectiva:i.perspectiva,valor:v,farol,obs,resp:i.resp,lancadoPor:"Rotinas ("+quemSou()+")",lancadoEm:new Date().toISOString()});
  }catch(e){}
}

function ajustarAssinaturas(){
  if(!S.subRot)return;
  const p=S.eu?permRot(pessoa(S.eu)):[];
  [["caixa","caixas","caixas","unsubCx"],["entregas","entregas","entDias","unsubEn"]].forEach(([perm,col,key,u])=>{
    if(p.includes(perm)&&!S[u])S[u]=S.subRot(col,key);
    else if(!p.includes(perm)&&S[u]){S[u]();S[u]=null;S[key]=[];}
  });

function calcCaixa(f,mostrar){
  const g=n=>{const el=f.querySelector(`[name="${n}"]`);const x=parseNum(el?el.value:"");return isNaN(x)?0:x;};
  const fundo=g("fundo"), sang=g("sangrias"), cont=g("contado"), din=cont+sang-fundo;
  const formas={}; let sis=0, conf=0;
  FORMAS.forEach((fp,k)=>{const s=g("s"+k), c=fp==="Dinheiro"?din:g("c"+k);formas[fp]={sistema:s,conferido:c};sis+=s;conf+=c;
    if(mostrar){const el=f.querySelector("#cx_d"+k),d=c-s;el.textContent=(s||c)?(d>0?"+":"")+brl(d):"–";el.className="num "+(d<-0.004?"neg":d>0.004?"pos":"");}});
  const dif=Math.round((conf-sis)*100)/100, pct=sis?Math.abs(dif)/sis*100:0;
  if(mostrar){
    f.querySelector("#cx_din").textContent=(cont||sang||fundo)?brl(din):"–";
    f.querySelector("#cx_ts").textContent=brl(sis);f.querySelector("#cx_tc").textContent=brl(conf);
    const td=f.querySelector("#cx_td");td.textContent=(dif>0?"+":"")+brl(dif);td.className="num "+(dif<0?"neg":dif>0?"pos":"");
    const ind=indRaw("quebra-de-caixa")||{}, fa=sis?farolAuto(pct,"Menor é melhor",ind.limVerde,ind.limAmarelo)||"Amarelo":"";
    f.querySelector("#cx_res").innerHTML=sis?`<span class="dot d-${fa}"></span> ${dif===0?"Caixa fechou sem diferença.":dif<0?"Faltou "+brl(-dif):"Sobrou "+brl(dif)} · ${pct.toLocaleString("pt-BR",{maximumFractionDigits:2})}% do vendido`:"";
  }
  return {fundo,sang,cont,formas,sis:Math.round(sis*100)/100,conf:Math.round(conf*100)/100,dif,pct:Math.round(pct*1000)/1000};
}
function recalcCaixa(data,semDoc,novo){
  const l=[...S.caixas.filter(c=>c.data===data&&c._doc!==semDoc&&!(novo&&c.em===novo.em&&c.por===novo.por)),...(novo?[novo]:[])];
  if(!l.length){lancAuto("quebra-de-caixa",data,null);lancAuto("conciliacao-no-mesmo-dia",data,null);return;}
  const abs=l.reduce((s,c)=>s+Math.abs(c.diferenca||0),0), sis=l.reduce((s,c)=>s+(c.totalSistema||0),0);
  lancAuto("quebra-de-caixa",data,sis?abs/sis*100:0,`${l.length} fechamento(s); diferenças somam ${brl(abs)} sobre ${brl(sis)}. Calculado pelas Rotinas`);

  lancAuto("conciliacao-no-mesmo-dia",data,noDia/l.length*100,`${noDia} de ${l.length} caixa(s) conferido(s) no mesmo dia. Calculado pelas Rotinas`);

/* ---- datas do plano ---- */
function basePlano(){return parseISO(S.geral.dataInicio)||hoje();}
function dataParaDia(d){return Math.round((d-basePlano())/864e5)+1;}
function prazoOriginal(a){return addDias(basePlano(),(Number(a.diaFimOrig??a.diaFim)||1)-1);}
function concluidaComAtraso(a){return a.status==="Concluída"&&a.concluidaEm&&parseISO(a.concluidaEm)>prazoOriginal(a);}
/* ---- status: regras e campos ---- */
function camposStatus(item,novo){
  if(novo===item.status)return {};
  const r={status:novo,statusPor:quemSou(),statusEm:new Date().toISOString()};
  if(novo==="Concluída")r.concluidaEm=iso(hoje());
  else if(item.status==="Concluída")r.concluidaEm=null;
  return r;
}
async function validarStatus(col,item,novo){
  if(novo!=="Em andamento"||item.status==="Em andamento")return true;
  if(col==="trilha"){
    const falta=faltaCustoMargem(item);
    if(falta){ await aviso("Regra da trilha comercial",`Antes de colocar em andamento, preencha ${falta}. Nenhuma iniciativa começa sem custo e margem calculados.`); return false; }
    if(item.categoria==="Produto"&&!item.aprovada){
      if(!ehLider()){ await aviso("Falta aprovação","Mudança de produto precisa da aprovação da Liderança. Fale com o Marco ou a Eliete."); return false; }
      if(!(await pergunta("Produto ainda não aprovado",`${item.id} ${item.oque}. Aprovar agora e colocar em andamento?`,"Aprovar e iniciar")))return false;
      if(!(await aprovarProduto(item,true)))return false;
    }
    const n=(S.raw.trilha||S.trilha).filter(t=>t.status==="Em andamento"&&t._doc!==item._doc).length;
    if(n>=LIM_TRILHA) return limiteOk(`Já existem ${n} iniciativas comerciais em andamento. O limite é ${LIM_TRILHA}.`);
  } else {
    const n=(S.raw.acoes||S.acoes).filter(t=>t.status==="Em andamento"&&t._doc!==item._doc).length;
    if(n>=LIM_PLANO) return limiteOk(`Já existem ${n} ações de controle em andamento. O limite é ${LIM_PLANO} ao mesmo tempo (seção 4.3).`);
  }
  return true;
}
async function limiteOk(msg){
  if(!ehLider()){ await aviso("Limite de ações simultâneas",msg+" Conclua uma antes ou fale com o Marco."); return false; }
  return pergunta("Limite de ações simultâneas",msg+" Quer iniciar mesmo assim?","Iniciar mesmo assim");
}
function faltaCustoMargem(t){
  const tem=v=>v!==undefined&&v!==null&&v!=="";
  if(!tem(t.custo))return t.categoria==="Produto"?"o custo unitário":"o custo estimado";
  if(t.categoria==="Produto"&&!tem(t.preco))return "o preço de venda (para calcular a margem)";
  return "";
}
function margemDe(t){const c=Number(t.custo),p=Number(t.preco);return (t.preco!==undefined&&t.preco!==""&&p>0&&!isNaN(c))?(p-c)/p*100:null;}
/* ---- diálogo secundário (aviso e pergunta) ---- */
function dlg2(html){
  return new Promise(res=>{
    const d=$("#dlg2"),f=$("#dlg2Form"); f.innerHTML=html; let r=false;
    f.onsubmit=ev=>{ev.preventDefault(); r=ev.submitter&&ev.submitter.value==="ok"; d.close();};
    d.addEventListener("close",()=>res(r),{once:true}); d.showModal();
  });
}

const pergunta=(t,m,ok)=>dlg2(`<h2>${esc(t)}</h2><p>${esc(m)}</p><div class="dlg-foot"><button class="btn ghost" value="cancel">Voltar</button><button class="btn" value="ok">${esc(ok)}</button></div>`);
/* ---- não deu no prazo ---- */
const MOTIVOS=["Falta de tempo da equipe","Dependia de outra pessoa ou fornecedor","Falta de dinheiro ou material","A prioridade mudou","O prazo foi mal estimado","Problema técnico ou de equipamento","Outro"];
function naoDeu(col,doc){
  const it=(col==="acoes"?S.acoes:S.trilha).find(x=>x._doc===doc); if(!it)return;
  const fimAtual=col==="acoes"?datasAcao(it).fim:parseISO(it.prazo);
  const sug=addDias(new Date(Math.max(hoje(),fimAtual||0)),14);
  const sts=(col==="acoes"?ST_PLANO:ST_TRILHA).filter(s=>s!=="Concluída"&&s!=="Cancelada");
  abrirDlg(`<h2>Registrar prazo não cumprido</h2><p><b>${esc(it.id)}</b> ${esc(it.oque)}</p>
    <p class="hint">${fimAtual?"Prazo atual: "+fmtD(fimAtual)+". ":"Sem data de prazo. "}O app guarda o prazo original e o motivo, para a gente entender onde o plano trava.</p>

function spark(h,u){
  const pts=h.filter(x=>!isNaN(Number(x.valor)));
  if(pts.length<2)return "";
  const W=480,H=120,P=28; const vs=pts.map(p=>Number(p.valor)); let mn=Math.min(...vs),mx=Math.max(...vs); if(mn===mx){mn-=1;mx+=1;}
  const x=i=>P+(W-2*P)*i/(pts.length-1), y=v=>H-18-(H-36)*(v-mn)/(mx-mn);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(Number(p.valor)).toFixed(1)}`).join("");
  const area=line+`L${x(pts.length-1)},${H-18}L${x(0)},${H-18}Z`;
  const L=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do indicador">
    <line x1="${P}" x2="${W-P}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)"/><line x1="${P}" x2="${W-P}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--acai-soft)"/><path d="${line}" fill="none" stroke="var(--acai)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(Number(p.valor))}" r="${i===pts.length-1?5:3}" fill="${p.farol==="Verde"?"var(--ok)":p.farol==="Amarelo"?"var(--warn)":"var(--bad)"}"/>`).join("")}
    <text x="${P}" y="${y(mx)-4}">${esc(fmtNum(mx,u))}</text><text x="${P}" y="${H-4}">${esc(fmtNum(mn,u))}</text>
    <text x="${W-P}" y="${H-4}" text-anchor="end">${esc(fmtD(parseISO(L.dataRef)))}</text></svg>`;
}

async function aprovarProposta(p,o={}){
  const doc=p._doc, destino=o.destino||p.destino, quem=o.quem||p.quem||p.propostoPor, motivo=o.motivo||"";
  if(p.status!=="Aguardando aprovação"){toast("Esta proposta já foi avaliada.");return false;}
  let idG;
  {
    if(destino==="plano"){
      const onda=Number(o.onda||p.onda||2); idG=proxIdPlano(onda);
      const fimMax=Math.max(30,...S.acoes.filter(a=>Number(a.onda)===onda).map(a=>Number(a.diaFim)||0)), iniMin=Math.min(...S.acoes.filter(a=>Number(a.onda)===onda).map(a=>Number(a.diaIni)||1),fimMax);
      const ok=await gravar(()=>S.db.doc("acoes/a"+idG.replace(".","_")).set({id:idG,onda,oque:p.oque,onde:p.onde,quem,responsaveis:respDeTexto(quem),diaIni:iniMin,diaFim:fimMax,status:"Não iniciada",rotina:false,obs:p.obs?("Proposta de "+p.propostoPor+": "+p.obs):"Proposta de "+p.propostoPor,ordem:Date.now()}));
      if(!ok)return false;
    } else {
      idG=proxIdTrilha();
      const ok=await gravar(()=>S.db.doc("trilha/"+idG.toLowerCase()).set({id:idG,num:Number(idG.slice(1)),categoria:o.categoria||p.categoria||"Produto",oque:p.oque,onde:p.onde,quem,responsaveis:respDeTexto(quem),prazo:"",prazoTexto:p.prazo||"Sem prazo fixo",status:"Não iniciada",obs:p.obs?("Proposta de "+p.propostoPor+": "+p.obs):""}));
      if(!ok)return false;
    }
    const r=await gravar(()=>S.db.doc("propostas/"+doc).update({status:"Promovida",idGerado:idG,motivo,avaliadoPor:quemSou(),avaliadoEm:new Date().toISOString()}),"Aprovada e incluída como "+idG+".");
    if(r)logHist(destino==="plano"?"acoes":"trilha",{_doc:destino==="plano"?"a"+idG.replace(".","_"):idG.toLowerCase(),id:idG,oque:p.oque},{tipo:"criacao",texto:"Proposta de "+p.propostoPor+" aprovada"});
    return r;
  }
}

const LOCAIS_F=["Loja","Fábrica","Gestão"];
const SEMENTE_F=[["Lary","","Gerente da loja","Loja"],["Alê","","Gerente da loja","Loja"],["Fábio","","Operador de fábrica","Fábrica"],["Gustavo","","Operador de fábrica","Fábrica"],["João","","Fábrica","Fábrica"],["Babi","","RH e pessoas","Gestão"],["Eliete","","Proprietária","Gestão"],["Marco","","Líder do plano","Gestão"]];

async function semearFuncionarios(){
  const ja=new Set((S.func||[]).map(f=>normEst(f.nome))), novos={};

const fmtHm=(m,sinal)=>{m=Math.round(m||0);const s=m<0?"-":(sinal&&m>0?"+":"");m=Math.abs(m);return s+Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");};
const NOME_MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const mesLabel=m=>{const [a,b]=String(m).split("-");return NOME_MES[Number(b)-1]+"/"+String(a).slice(2);};

function mesesPonto(){return [...new Set(S.ponto.map(p=>p.mes))].sort().reverse();}
function resumoPonto(mes){
  const l=S.ponto.filter(p=>p.mes===mes), trab=l.filter(p=>p.diasTrab>0);
  const F=trab.reduce((s,p)=>s+p.faltasMin,0), P=trab.reduce((s,p)=>s+p.prevMin,0), X=trab.reduce((s,p)=>s+p.extrasMin,0), N=trab.reduce((s,p)=>s+p.adNotMin,0);
  return {l,trab,abs:P?F/P*100:0,F,P,X,N,media:trab.length?X/trab.length:0,banco:l.reduce((s,p)=>s+(p.bancoMin||0),0)};
}

async function lancarPontoInd(mes){
  const r=resumoPonto(mes); if(!r.trab.length)return;
  const fim=mes+"-01";
  const itens=[["absenteismo","calc-absent-"+mes,Math.round(r.abs*100)/100,`${mesLabel(mes)}. ${fmtHm(r.F)} de faltas e atrasos em ${fmtHm(r.P)} previstas (${r.trab.length} pessoas). Fonte: cartão de ponto.`],
    ["horas-extras","calc-hextras-"+mes,Math.round(r.media/6)/10,`${mesLabel(mes)}. ${fmtHm(r.X)} de extras no total, ${r.trab.length} pessoas. Adicional noturno ${fmtHm(r.N)}. Fonte: cartão de ponto.`]];

async function conferirPin(u,pin){
  const tk="sorvely_tent_"+slugP(u.nome), t=lsGet(tk)||{n:0,ate:0};
  if(t.ate>Date.now())return "travado";
  let ok=false;
  try{ ok=(window.FB&&FB.conferir)?await FB.conferir(u._doc,pin):(!!u.pinHash&&(await hashPin(pin,u.pinSalt))===u.pinHash); }catch(e){ok=false;}
  if(ok){lsSet(tk,null);return "ok";}
  t.n++; if(t.n>=MAX_TENT){t.ate=Date.now()+5*60000;t.n=0;} lsSet(tk,t); return t.ate>Date.now()?"travado":"errado";
}
function concluirCk(tipo){
  const hj=iso(hoje()), id=hj+"_"+tipo, c=ckDoc(hj,tipo), base=itensCk(tipo), marc=(c&&c.marcados)||{};
  const faltam=base.filter((_,i)=>!marc[i]), pend=($("#ckPend")||{}).value||"";

    if(!snap.metadata.fromCache){S.loaded[col]=true; if(["acoes","trilha","indicadores"].every(c=>S.loaded[c])){clearTimeout(S.slowT);S.slow=false;}}
    agendaRender();
  },err=>{ if(err.code==="revoked"){S.db=null;} clearTimeout(S.slowT); agendaRender(); });
}
(async function init(){
  if(location.hash&&location.hash!=="#inicio"){try{history.replaceState(null,"",location.pathname+location.search+"#inicio");}catch(e){location.hash="inicio";}}
  rota();
  if(!window.claude||!window.claude.use){ render(); return; }
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  S.db=db; S.user=user; S.tentouDb=true;
  if(user){ try{S.uid=await user.id();}catch(e){} try{S.owner=!!user.isOwner();}catch(e){} try{const c=await user.can("data.write"); if(c===false)S.canWrite=false;}catch(e){} }
  if(!db){ render(); return; }
  S.slowT=setTimeout(()=>{S.slow=true;render();},10000);
  S.sessao=lsGet("sorvely_sessao");
  if(S.uid&&!(S.sessao&&S.sessao.exp>Date.now())){ try{ const g=await db.doc("data/users/"+S.uid+"/sessao").get(); if(g.exists)S.sessao=g.data(); }catch(e){} }
  db.doc("config/geral").onSnapshot(s=>{ if(s.exists)S.geral=s.data(); agendaRender(); },()=>{});
  assinar("acoes","acoes"); assinar("trilha","trilha"); assinar("indicadores","indicadores");
  assinar("lancamentos","lanc"); assinar("propostas","propostas");
  assinar("solicitacoes","solic"); assinar("ordens","ordens"); assinar("produtos","produtos");
  { const cut=iso(addDias(hoje(),-62)); const sub=(col,key)=>db.collection(col).where("data",">=",cut).onSnapshot(sn=>{S[key]=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    S.subRot=sub; sub("temperaturas","tempDias"); sub("checklists","checklists"); ajustarAssinaturas();
    db.collection("fotos").where("em",">=",new Date(Date.now()-31*864e5).toISOString()).onSnapshot(sn=>{S.fotos=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    db.collection("ponto").onSnapshot(sn=>{const l=sn.docs.map(d=>({...d.data(),_doc:d.id}));S.ponto=l.filter(x=>!x.cadastro);S.func=l.filter(x=>x.cadastro);agendaRender();},()=>{});
    db.collection("comunicados").onSnapshot(sn=>{S.comunicados=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    db.collection("ciencias").onSnapshot(sn=>{S.ciencias=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    db.doc("config/checklist").onSnapshot(s=>{S.ckCfg=s.exists?s.data():null;agendaRender();},()=>{});
    db.collection("vendasProduto").onSnapshot(sn=>{S.vendasProd=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{});
    db.collection("estoque").onSnapshot(sn=>{S.estoque=sn.docs.map(d=>({...d.data(),_doc:d.id}));assinarMov();agendaRender();},()=>{});
    db.collection("equipamentos").onSnapshot(sn=>{S.equip=sn.docs.map(d=>({...d.data(),_doc:d.id}));agendaRender();},()=>{}); }
  db.collection("historico").orderBy("em","desc").limit(1500).onSnapshot(snap=>{S.raw.hist=snap.docs.map(d=>({...d.data(),_doc:d.id}));aplicarVis();agendaRender();},()=>{});
  db.collection("usuarios").onSnapshot(snap=>{
    S.usuarios=snap.docs.map(d=>({...d.data(),_doc:d.id}));
    const antes=S.eu; S.eu=sessaoValida(); aplicarVis();
    if(antes&&!S.eu)toast("Sua sessão terminou. Entre de novo.");
    if(!snap.metadata.fromCache&&!S.pediuLogin){S.pediuLogin=true; if(!S.eu)setTimeout(()=>{ if(!$("#dlg").open) entrar(true); },400);}
    agendaRender();
  },()=>{});
  render();
})();
</script>
